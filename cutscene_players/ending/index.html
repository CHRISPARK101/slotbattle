<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엔딩 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Noto+Serif+KR:wght@600;800&family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: 게임 화면 그대로 보여주는 시사 도구, 조용하게
   IDEA: 세로 모바일 화면 속 극장판 오프닝
   PICTURE: 9:16 게임 화면. 가로 풍경은 높이에 맞춰 옆으로 훑고, 세로 그림은 천천히 확대
   COLOUR and TYPE: 밤하늘 남색 + 황금, 자막은 Noto Serif KR, 로고는 Cinzel
   LAYOUT: 왼쪽 게임 화면, 오른쪽 컷 목록과 연출 메모 */
:root{color-scheme:dark;--bg:#0b1328;--panel:#141f3b;--line:#2b3b62;--ink:#f3ead6;--mute:#a9b3cc;--gold:#e9bf5c}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(18px,3vw,36px) max(4vw,16px);max-width:1100px;margin:0 auto}
h1{font:800 clamp(26px,4vw,38px)/1.1 "Noto Serif KR",serif;margin:0 0 6px;color:var(--gold)}
.lead{margin:0 0 18px;color:var(--mute);max-width:70ch}
.wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.screen{container-type:size;position:relative;height:min(78vh,760px);aspect-ratio:9/16;overflow:hidden;background:#000;border-radius:18px;box-shadow:0 0 0 8px #1c2442,0 24px 60px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.cut{position:absolute;inset:0;opacity:0;overflow:hidden}
.layer{position:absolute;top:0;left:0;height:100%;will-change:transform,filter}
.layer img{display:block;width:100%;height:100%;object-fit:cover}
.land{aspect-ratio:1344/768}
.port{width:100%}
.wheelbox{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%)}
.wheelbox svg{width:100%;height:100%;display:block;overflow:visible}
.hglow{position:absolute;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,170,210,.95) 0,rgba(255,111,159,.45) 35%,rgba(255,111,159,0) 70%);mix-blend-mode:screen;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(.8);opacity:.6}35%{transform:translate(-50%,-50%) scale(1.12);opacity:1}}
canvas.fx,canvas.grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
canvas.grain{opacity:.13;mix-blend-mode:overlay}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.6) 100%)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.sub{position:absolute;left:0;right:0;bottom:0;min-height:17%;background:linear-gradient(transparent,rgba(0,0,0,.85) 28%);display:flex;align-items:center;justify-content:center;padding:28px 7% 18px;text-align:center;font:600 clamp(14px,2.2vh,18px)/1.6 "Noto Serif KR",serif;text-shadow:0 2px 6px #000;word-break:keep-all;text-wrap:balance;opacity:0;transition:opacity .4s;pointer-events:none}
.sub.on{opacity:1}
.skip{position:absolute;top:12px;right:12px;z-index:5;font:600 13px "Noto Sans KR";min-height:36px;padding:0 14px;border-radius:18px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;cursor:pointer}
.start{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#22345f,#070b18 75%);cursor:pointer;border:0;color:var(--ink);font:600 18px "Noto Sans KR";width:100%}
.start span{display:grid;gap:10px;justify-items:center}
.start b{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--gold);color:#2a1a04;font-size:30px}
.logo{position:absolute;inset:0;opacity:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#2a3d6b,#070b18 72%)}
.logo .lw{position:absolute;left:50%;top:40%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);opacity:.55}
.logo .lw svg{width:100%;height:100%;display:block}
.title{position:relative;z-index:2;display:grid;gap:18px;justify-items:center;transform:translateY(10%)}
.reels{display:flex;gap:10px}
.reels div{width:17cqw;height:19cqw;background:#f6ecd2;border:4px solid #2e1a06;border-radius:10px;display:grid;place-items:center;box-shadow:0 6px 0 #5e3610}
.reels svg{width:72%;height:72%}
.name{font:900 12cqw/1 "Cinzel",serif;letter-spacing:.02em;white-space:nowrap;text-align:center;background:linear-gradient(#fff6cf,#f2c55a 45%,#b0701c 55%,#ffe39a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2e1a06) drop-shadow(0 0 18px rgba(255,200,90,.6));opacity:0;transform:scale(.7);transition:opacity .5s,transform .6s cubic-bezier(.2,1.6,.4,1)}
.name.on{opacity:1;transform:none}
.again{opacity:0;transition:opacity .4s;font:600 15px "Noto Sans KR";min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}
.again.on{opacity:1}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;transition:border-color .3s,background .3s}
.list li.now{border-color:var(--gold);background:#1d2a4d}
.list b{color:var(--gold);margin-right:8px}
.list small{display:block;color:var(--mute);font-size:13px}
.note{font-size:13px;color:var(--mute)}
button:focus-visible{outline:3px solid #ffd98a;outline-offset:2px}
@media(max-width:760px){.wrap{grid-template-columns:1fr;justify-items:center}.screen{height:min(80vh,640px)}}
.scenes{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.scenes button{font:600 15px "Noto Sans KR";min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.scenes button.on{background:var(--gold);color:#2a1a04;border-color:var(--gold)}
.layer video{display:block;width:100%;height:100%;object-fit:cover}
.greyl{position:absolute;inset:0;filter:grayscale(1) brightness(.85)}
.greyl img{width:100%;height:100%;object-fit:cover;display:block}
.pinkfill{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;background:radial-gradient(circle at 50% 38%,rgba(255,150,200,.95),rgba(255,110,160,.5) 40%,rgba(255,110,160,0) 75%)}
.card{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 10%;background:#000;opacity:0;font:600 clamp(15px,2.4vh,20px)/1.9 "Noto Serif KR",serif;word-break:keep-all;text-wrap:balance}
.card small{display:block;margin-top:18px;color:var(--gold);font-size:.85em}
.end{display:block;margin-top:8px;font:900 7cqw/1 "Cinzel",serif;color:#f3ead6;letter-spacing:.1em}
.list li{cursor:default}
</style>
</head>
<body>
<div class="band">
 <h1>엔딩 미리보기</h1>
 <p class="lead">일반 엔딩과 진엔딩을 게임 세로 화면처럼 재생해요. N2는 Wan2GP로 만든 영상 컷이고, 나머지는 그림 + 카메라 움직임 + 코드 효과예요.</p>
 <div class="scenes" id="scenes"><button data-s="N" class="on">일반 엔딩 (약 45초)</button><button data-s="T">진엔딩 (약 60초)</button></div>
 <div class="wrap">
  <div class="screen" id="screen">
   <div id="cuts"></div>
   <div class="logo" id="logo"><div class="lw" id="lw"></div><div class="title"><div class="reels" id="lreels"><div></div><div></div><div></div></div><div class="name" id="lname">SLOT BATTLE</div><button class="again" id="again">다시 보기</button></div></div>
   <canvas class="fx" id="fx"></canvas>
   <div class="flash" id="flash"></div>
   <div class="vig"></div>
   <canvas class="grain" id="grain" width="180" height="320"></canvas>
   <div class="sub" id="sub"></div>
   <button class="skip" id="skip">건너뛰기</button>
   <button class="start" id="start"><span><b>▶</b><em id="startLabel" style="font-style:normal">일반 엔딩 재생</em></span></button>
  </div>
  <div>
   <ol class="list" id="list"></ol>
   <p class="note">화면을 탭하면 다음 컷, 길게 누르거나 건너뛰기를 누르면 끝으로 넘어가요. 소리는 아직 없어요. N5는 다시 뽑을 컷이라 임시 그림이에요.</p>
  </div>
 </div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="symdefs"></defs></svg>
<script>

// 운명륜 (90년대 셀 애니 금속 칠): 단색 바탕 + 경계가 딱 떨어지는 그림자·하이라이트 + 굵은 외곽선 + 고정된 반짝임
// 빛은 화면 왼쪽 위에서 고정. 바퀴가 돌아도 그림자·하이라이트·반짝임은 제자리에 있다
function fateWheelSVG(o = {}) {
  const id = o.id || 'fw', T = Math.PI * 2;
  const C = { base: '#e6ab3e', band: '#c88a2b', shade: '#a6611a', hi: '#fff2b8', deep: '#5e3610', line: '#2e1a06' };
  const f = n => n.toFixed(1);
  const P = (r, a) => f(r * Math.cos(a)) + ',' + f(r * Math.sin(a));
  const circ = (r, cx = 0, cy = 0) => `M${f(cx + r)},${f(cy)}a${r},${r} 0 1,0 ${-2 * r},0a${r},${r} 0 1,0 ${2 * r},0Z`;
  const N = 36, p = T / N; let teeth = 'M';
  for (let i = 0; i < N; i++) { const a = i * p; teeth += [P(440, a), P(490, a + .2 * p), P(490, a + .45 * p), P(440, a + .65 * p)].join('L') + 'L'; }
  teeth = teeth.slice(0, -1) + 'Z' + circ(400);
  let spokes = '';
  for (let i = 0; i < 12; i++) spokes += `<path transform="rotate(${i * 30})" fill-rule="evenodd" d="M118,-18C190,-32 270,-8 352,-27L352,27C270,8 190,32 118,18Z M198,0a42,10 0 1,0 84,0a42,10 0 1,0 -84,0Z"/>`;
  let inner = circ(206) + circ(168), iteeth = '';
  for (let i = 0; i < 16; i++) { const a = i * T / 16; inner += circ(7, 187 * Math.cos(a), 187 * Math.sin(a)); }
  for (let i = 0; i < 24; i++) { const a = i * T / 24; iteeth += 'M' + [P(170, a - .075), P(150, a), P(170, a + .075)].join('L') + 'Z'; }
  let marks = '';
  for (let i = 0; i < 24; i++) {
    const a = i * T / 24;
    marks += i % 2 ? circ(6, 375 * Math.cos(a), 375 * Math.sin(a)) : 'M' + [P(389, a), P(375, a + .03), P(361, a), P(375, a - .03)].join('L') + 'Z';
  }
  let star = 'M';
  for (let i = 0; i < 16; i++) star += P(i % 2 ? 40 : 84, i * T / 16 - T / 4) + (i < 15 ? 'L' : 'Z');
  const cracks = 'M70,-30L150,-80L172,-68L240,-160L262,-150L330,-262L356,-270L420,-330L470,-376' +
    'M-60,40L-130,110L-118,132L-200,190L-230,186L-300,270L-330,268L-390,340' +
    'M-20,-90L-60,-170L-44,-190L-90,-280L-120,-290L-150,-400L-170,-470';
  const spark = (x, y, r) => `M${x},${y - r}Q${x},${y} ${x + r},${y}Q${x},${y} ${x},${y + r}Q${x},${y} ${x - r},${y}Q${x},${y} ${x},${y - r}Z`;
  let rays = '';
  for (let i = 0; i < 16; i++) { const a = i * T / 16; rays += 'M0,0L' + P(660, a - .035) + 'L' + P(660, a + .035) + 'Z'; }
  const both = `<use href="#${id}O"/><use href="#${id}I"/>`;
  const cut = (dx, dy, mid) => `<mask id="${mid}" maskUnits="userSpaceOnUse" x="-700" y="-700" width="1400" height="1400"><g fill="#fff">${both}</g><g fill="#000" transform="translate(${dx},${dy})">${both}</g></mask>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-650 -650 1300 1300">
<defs>
<g id="${id}O"><path d="${teeth}" fill-rule="evenodd"/><path d="${circ(400) + circ(350)}" fill-rule="evenodd"/>${spokes}<path d="${circ(258) + circ(244)}" fill-rule="evenodd"/><circle r="122"/></g>
<g id="${id}I"><path d="${inner}" fill-rule="evenodd"/><path d="${iteeth}"/></g>
<g id="${id}D"><path d="${circ(398) + circ(352)}" fill-rule="evenodd" fill="${C.band}"/><path d="${marks}" fill="${C.deep}"/><circle r="96" fill="${C.shade}" stroke="${C.line}" stroke-width="4"/><path d="${star}" fill="${C.base}" stroke="${C.line}" stroke-width="4" stroke-linejoin="round"/></g>
<g id="${id}K" fill="none" stroke-linejoin="round"><path d="${cracks}" stroke="${C.line}" stroke-width="11"/><path d="${cracks}" stroke="#fffbe6" stroke-width="3"/></g>
${cut(-16, -16, id + 'ms')}${cut(10, 10, id + 'mh')}
<mask id="${id}cp" maskUnits="userSpaceOnUse" x="-700" y="-700" width="1400" height="1400"><g fill="#fff">${both}</g></mask>
<radialGradient id="${id}h"><stop offset="0" stop-color="#ffe7a3" stop-opacity=".9"/><stop offset=".5" stop-color="#ffc96e" stop-opacity=".3"/><stop offset="1" stop-color="#ffbe5a" stop-opacity="0"/></radialGradient>
<radialGradient id="${id}r"><stop offset=".15" stop-color="#fff6d0" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d0" stop-opacity="0"/></radialGradient>
</defs>
<g class="fw-glow"><circle r="640" fill="url(#${id}h)"/><path class="fw-rays" d="${rays}" fill="url(#${id}r)"/></g>
<g fill="${C.deep}" transform="translate(12,14)">${both}</g>
<g fill="${C.base}">${both}</g>
<use href="#${id}D"/>
<g mask="url(#${id}ms)"><rect x="-700" y="-700" width="1400" height="1400" fill="${C.shade}"/></g>
<g mask="url(#${id}mh)"><rect x="-700" y="-700" width="1400" height="1400" fill="${C.hi}"/></g>
<g fill="none" stroke="${C.line}" stroke-width="5" stroke-linejoin="round">${both}</g>
<use class="fw-cracks" href="#${id}K" style="display:none"/>
<g mask="url(#${id}cp)" fill="#fffdf0" opacity=".85"><g transform="rotate(45)"><rect x="-398" y="-700" width="24" height="1400"/><rect x="-344" y="-700" width="9" height="1400"/><rect x="-170" y="-700" width="14" height="1400"/></g></g>
<circle r="42" fill="#ffb347" stroke="${C.line}" stroke-width="4"/><circle r="28" fill="#ffe7a0"/><circle cx="-6" cy="-6" r="12" fill="#fff"/>
<path d="${spark(-318, -318, 64) + spark(-196, -420, 30) + spark(-14, -14, 26)}" fill="#fff"/>
</svg>`;
}

// 회전: box 안에 바퀴를 넣고 돌린다. 반환값의 속성을 바꾸면 바로 반영된다
function startFateWheel(box, opt = {}) {
  const id = opt.id || 'fw';
  box.innerHTML = fateWheelSVG(opt);
  const svg = box.querySelector('svg');
  const outer = [svg.getElementById(id + 'O'), svg.getElementById(id + 'D'), svg.getElementById(id + 'K')];
  const inner = svg.getElementById(id + 'I'), rays = svg.querySelector('.fw-rays'), glow = svg.querySelector('.fw-glow');
  const st = { speed: 8, counter: true, glow: .6, cracked: false, ...opt };
  let a = 0, b = 0, last = performance.now(), run = true;
  function frame(t) {
    const dt = Math.min(.1, (t - last) / 1000); last = t;
    a += st.speed * dt; b = st.counter ? b - st.speed * 1.6 * dt : a;
    for (const g of outer) g.setAttribute('transform', `rotate(${a.toFixed(2)})`);
    inner.setAttribute('transform', `rotate(${b.toFixed(2)})`);
    rays.setAttribute('transform', `rotate(${(-a * .25).toFixed(2)})`);
    glow.setAttribute('opacity', st.glow);
    svg.querySelector('.fw-cracks').style.display = st.cracked ? '' : 'none';
    if (run) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  st.stop = () => { run = false; };
  st.svg = svg;
  return st;
}
</script>
<script>
{
const C = { base: '#e6ab3e', line: '#2e1a06' };
const f = n => n.toFixed(1);
const heart = (s) => `M0,${f(.35 * s)}C${f(-.9 * s)},${f(-.3 * s)} ${f(-.45 * s)},${f(-1 * s)} 0,${f(-.45 * s)}C${f(.45 * s)},${f(-1 * s)} ${f(.9 * s)},${f(-.3 * s)} 0,${f(.35 * s)}Z`;
const L = `stroke="${C.line}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
document.getElementById('symdefs').innerHTML = `
<symbol id="sword" viewBox="0 0 64 64"><g transform="rotate(45 32 32)"><path d="M28,6L36,6L36,40L28,40Z" fill="#e6edf5" ${L}/><path d="M32,6L36,6L36,40L32,40Z" fill="#9aa8bb"/><path d="M28,6L32,1L36,6" fill="#e6edf5" ${L}/><rect x="18" y="40" width="28" height="6" rx="2" fill="${C.base}" ${L}/><rect x="29" y="46" width="6" height="11" fill="#7a4a24" ${L}/><circle cx="32" cy="60" r="3.5" fill="${C.base}" ${L}/></g></symbol>
<symbol id="spear" viewBox="0 0 64 64"><g transform="rotate(45 32 32)"><rect x="29.5" y="20" width="5" height="42" fill="#8a5a2e" ${L}/><path d="M32,2L40,18L32,24L24,18Z" fill="#e6edf5" ${L}/><path d="M32,2L40,18L32,24Z" fill="#9aa8bb"/><rect x="26" y="22" width="12" height="4" fill="#d9434b" ${L}/></g></symbol>
<symbol id="bow" viewBox="0 0 64 64"><path d="M18,6C48,14 48,50 18,58" fill="none" stroke="${C.line}" stroke-width="9" stroke-linecap="round"/><path d="M18,6C48,14 48,50 18,58" fill="none" stroke="#a0683a" stroke-width="4" stroke-linecap="round"/><path d="M18,6L18,58" stroke="#f3ead6" stroke-width="2"/><path d="M10,32L52,32" ${L} stroke-width="3"/><path d="M50,27L58,32L50,37Z" fill="#e6edf5" ${L}/></symbol>
<symbol id="staff" viewBox="0 0 64 64"><rect x="29" y="22" width="6" height="40" rx="2" fill="#8a5a2e" ${L}/><path d="M22,22C20,10 44,10 42,22" fill="none" ${L}/><circle cx="32" cy="15" r="10" fill="#6fb6ff" ${L}/><circle cx="29" cy="12" r="3.5" fill="#fff"/></symbol>
<symbol id="shield" viewBox="0 0 64 64"><path d="M10,10L54,10L54,30C54,46 42,56 32,61C22,56 10,46 10,30Z" fill="${C.base}" ${L}/><path d="M16,15L48,15L48,30C48,42 40,50 32,54C24,50 16,42 16,30Z" fill="#3f6fc4" ${L} stroke-width="2.5"/><path d="M32,15L48,15L48,30C48,42 40,50 32,54Z" fill="#2c4f93"/><path d="M32,20L32,48M22,30L42,30" stroke="#f3ead6" stroke-width="4"/></symbol>
<symbol id="heart" viewBox="-32 -32 64 64"><path d="${heart(30)}" transform="translate(0,6)" fill="${'#ff5c93'}" ${L}/><circle cx="-9" cy="-6" r="5" fill="#fff" opacity=".9"/></symbol>`;
const SYM = ['sword', 'spear', 'bow', 'staff', 'shield', 'heart'];
const icon = id => `<svg viewBox="0 0 64 64"><use href="#${id}"/></svg>`;

// 컷 정의: kind img|video|card|logo, land(가로), pan/zoom, fx, text(' / '로 나누면 차례로)
const SCENES = {
  N: [
    { id: 'N1', dur: 5, zoom: [1, 1.12], origin: '50% 35%', text: '정지의 왕: 어째서… 멈추면, 아무것도 잃지 않는데…', memo: '천천히 확대, 음악 없음' },
    { id: 'N2', kind: 'video', land: 1, dur: 5, pan: [.25, .75], rate: .45, text: '멈췄던 별들이 다시 흐르기 시작했다.', memo: 'Wan2GP 영상 컷 (2초를 느리게 재생)' },
    { id: 'N3', dur: 5, zoom: [1, 1.18], origin: '50% 30%', fx: 'pink', text: '세계심장의 불씨가 기원의 슬롯으로 흘러들었다.', memo: '분홍빛이 화면을 채우며 확대' },
    { id: 'N4', land: 1, dur: 6, pan: [.32, .68], fx: 'form', wx: .5, wy: .2, ww: .16, text: '부서진 운명륜이 다시 돌기 시작했다.', memo: '금빛 조각이 모여 운명륜이 다시 돈다 (코드 합성)' },
    { id: 'N5', land: 1, dur: 7, pan: [0, 1], fx: 'sweep', text: '', memo: '긴 팬, 지나가는 곳마다 회색 → 천연색' },
    { id: 'N6', dur: 5, zoom: [1, 1.1], origin: '50% 30%', text: '루미: 해냈어요! 이제… 운명은 다시 우리 거예요.', memo: '천천히 확대' },
    { id: 'N7', land: 1, dur: 6, pan: [.15, .6], fx: 'rise', text: '영웅들의 혼은 운명륜으로 돌아갔다. 다시 불릴 날을 기다리며.', memo: '빛 입자가 하늘로 떠오름 (코드 효과)' },
    { id: 'N8', kind: 'card', dur: 6, html: '그런데, 정지의 왕은 왜<br>모든 것을 멈추려 했을까?<small>Hard에서 진실이 밝혀집니다.</small>', memo: '검은 화면에 글자만' }],
  T: [
    { id: 'T1', dur: 6, zoom: [1, 1.12], origin: '50% 28%', text: '왕관 아래에는 지친 기사의 얼굴이 있었다.', memo: '천천히 확대, 정적' },
    { id: 'T2', land: 1, dur: 6, pan: [.2, .8], fx: 'flash', text: '그는 여신의 첫 번째 영웅이었다.', memo: '회상: 바랜 색 + 강한 필름 입자' },
    { id: 'T3', land: 1, dur: 6, pan: [.6, .35], fx: 'flash rain', text: '운명은 돌았고, 그가 사랑한 이들을 하나씩 데려갔다.', memo: '회상 + 비 (코드 효과)' },
    { id: 'T4', dur: 6, zoom: [1, 1.15], origin: '40% 55%', fx: 'flash stone', text: '기사: 다시는… 누구도 잃지 않게. 전부 멈춰 버리면 돼.', memo: '회상, 색이 회색으로 굳어 감' },
    { id: 'T5', dur: 5, zoom: [1.08, 1.18], origin: '50% 50%', fx: 'thaw', text: '루미: 잃는 게 무서워서 멈추면, 다시 만날 수도 없잖아요.', memo: '잡은 손에서 색이 돌아옴' },
    { id: 'T6', dur: 7, zoom: [1.16, 1.16], tilt: [7, -7], origin: '50% 50%', fx: 'glow', text: '루멘: 고마워요, 나의 마지막 릴 마스터. / 루멘: 그리고… 오래 기다리게 했구나, 나의 첫 번째 영웅.', memo: '아래→위 틸트, 대사 두 줄' },
    { id: 'T7', dur: 6, zoom: [1, 1.08], origin: '50% 30%', fx: 'rise', text: '첫 번째 영웅: …다음 바퀴에서는, 함께 돌 수 있을까.', memo: '빛 입자로 풀림 (코드 효과, 영상은 얼굴이 변해서 그림 사용)' },
    { id: 'T8', land: 1, dur: 6, pan: [.6, .76], fx: 'wheel', wx: .66, wy: .36, ww: .17, text: '운명륜은 다시 돌았다. 이번에는 아무도 멈추지 않았다.', memo: '아침 하늘에 운명륜 (코드 합성)' },
    { id: 'T9', dur: 5, zoom: [1, 1.12], origin: '50% 40%', fx: 'heartT9', text: '루미: 자, 다음 바퀴를 돌려 볼까요?', memo: '레버 → 릴 회전' },
    { id: 'T10', kind: 'logo', dur: 6, text: '끝까지 함께해 줘서 고마워요. 운명은 계속 돌아갑니다.', memo: '로고 + THE END' }]
};

const $ = id => document.getElementById(id);
const screen = $('screen'), cutsEl = $('cuts'), sub = $('sub'), list = $('list'), fxc = $('fx'), flash = $('flash'), logo = $('logo');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let scene = 'N', CUTS = SCENES.N, els = [], wheels = [];

function build() {
  cutsEl.innerHTML = ''; wheels.forEach(w => w.stop()); wheels = [];
  CUTS = SCENES[scene];
  list.innerHTML = CUTS.map(c => `<li><b>${c.id}</b>${c.dur}초<small></small></li>`).join('');
  [...list.children].forEach((li, i) => li.querySelector('small').textContent = CUTS[i].memo);
  els = CUTS.map(c => {
    const d = document.createElement('div'); d.className = 'cut';
    if (c.kind === 'card') { d.innerHTML = `<div class="card" style="opacity:1">${c.html}</div>`; }
    else if (c.kind !== 'logo') {
      const media = c.kind === 'video' ? `<video src="vid/${c.id}.mp4" muted playsinline preload="auto"></video>` : `<img src="img/${c.id}.jpg" alt="">`;
      d.innerHTML = `<div class="layer ${c.land ? 'land' : 'port'}" style="${c.id === 'N5' ? 'aspect-ratio:1536/640' : ''}">${media}` +
        (c.fx === 'sweep' ? `<div class="greyl"><img src="img/${c.id}.jpg" alt=""></div>` : '') +
        (/wheel|form/.test(c.fx || '') ? `<div class="wheelbox" style="left:${c.wx * 100}%;top:${c.wy * 100}%;width:${c.ww * 100}%"></div>` : '') +
        (c.fx === 'heartT9' ? `<div class="hglow" style="left:36%;top:30%;width:26%"></div>` : '') + '</div>' +
        (c.fx === 'pink' || c.fx === 'glow' ? '<div class="pinkfill"' + (c.fx === 'glow' ? ' style="background:radial-gradient(circle at 50% 35%,rgba(255,236,170,.9),rgba(255,210,120,.4) 40%,rgba(255,210,120,0) 75%)"' : '') + '></div>' : '');
    }
    cutsEl.appendChild(d); return d;
  });
}

// 필름 입자
const g = $('grain'), gx = g.getContext('2d'), gi = gx.createImageData(180, 320);
setInterval(() => { for (let i = 0; i < gi.data.length; i += 4) { const v = Math.random() * 255; gi.data[i] = gi.data[i + 1] = gi.data[i + 2] = v; gi.data[i + 3] = 255; } gx.putImageData(gi, 0, 0); }, 70);

// 파티클: rise(빛 입자), rain(비), form(모이는 조각)
const fx = fxc.getContext('2d'); let parts = [], mode = '', target = null;
function tickFx() {
  const w = fxc.width = screen.clientWidth, h = fxc.height = screen.clientHeight;
  fx.clearRect(0, 0, w, h);
  if (!reduce) {
    if (mode.includes('rise') && Math.random() < .7) for (let k = 0; k < 2; k++) parts.push({ t: 'rise', x: Math.random() * w, y: h * (.55 + Math.random() * .45), vx: (Math.random() - .5) * .4, vy: -(.6 + Math.random() * 1.4), life: 1, sz: 1.5 + Math.random() * 3 });
    if (mode.includes('rain')) for (let k = 0; k < 6; k++) parts.push({ t: 'rain', x: Math.random() * (w + 80), y: -20, vx: -2.2, vy: 16 + Math.random() * 6, life: 1, sz: 10 + Math.random() * 12 });
  }
  parts = parts.filter(p => p.life > 0 && p.y < h + 40);
  for (const p of parts) {
    if (p.t === 'form' && target) { p.vx += (target.x - p.x) * .006; p.vy += (target.y - p.y) * .006; p.vx *= .93; p.vy *= .93; if (Math.hypot(target.x - p.x, target.y - p.y) < 8) p.life -= .08; }
    p.x += p.vx; p.y += p.vy;
    if (p.t === 'rise') { p.life -= .006; fx.globalAlpha = Math.min(1, p.life * 1.5) * .9; fx.fillStyle = '#ffe7a3'; fx.shadowColor = '#ffd36e'; fx.shadowBlur = 8; fx.beginPath(); fx.arc(p.x, p.y, p.sz, 0, 7); fx.fill(); fx.shadowBlur = 0; }
    else if (p.t === 'rain') { fx.globalAlpha = .35; fx.strokeStyle = '#cfd8e6'; fx.lineWidth = 1.2; fx.beginPath(); fx.moveTo(p.x, p.y); fx.lineTo(p.x + p.vx * .8, p.y + p.sz); fx.stroke(); }
    else { fx.globalAlpha = Math.max(0, p.life); fx.fillStyle = p.c; fx.save(); fx.translate(p.x, p.y); fx.rotate(p.x * .05); fx.fillRect(-p.sz / 2, -p.sz / 3, p.sz, p.sz * .66); fx.restore(); }
  }
  fx.globalAlpha = 1;
  requestAnimationFrame(tickFx);
}
requestAnimationFrame(tickFx);

let idx = -1, timer = null, timers = [], playing = false;
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
function clear() { clearTimeout(timer); timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; mode = ''; target = null; }
function subtitle(text, ms) {
  sub.classList.remove('on');
  const lines = (text || '').split(' / ').filter(Boolean), each = ms / Math.max(1, lines.length);
  lines.forEach((t, k) => {
    later(() => { sub.textContent = t; sub.classList.add('on'); }, k * each + 350);
    later(() => sub.classList.remove('on'), (k + 1) * each - 250);
  });
}
function show(i) {
  clear(); idx = i;
  [...list.children].forEach((li, k) => li.classList.toggle('now', k === i));
  if (i >= CUTS.length) return end();
  const c = CUTS[i], el = els[i], ms = c.dur * 1000, D = reduce ? 1 : ms + 400;
  els.forEach((e, k) => { if (k !== i) e.animate([{ opacity: getComputedStyle(e).opacity }, { opacity: 0 }], { duration: 400, fill: 'forwards' }); });
  logo.animate([{ opacity: getComputedStyle(logo).opacity }, { opacity: 0 }], { duration: 400, fill: 'forwards' });
  if (c.kind === 'logo') return showLogo(c, ms);
  el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, fill: 'forwards' });
  if (c.kind === 'card') { sub.classList.remove('on'); timer = setTimeout(() => show(i + 1), ms); return; }
  const layer = el.querySelector('.layer'), FW = screen.clientWidth, LW = layer.clientWidth, ov = Math.max(0, LW - FW);
  if (c.land) layer.animate([{ transform: `translateX(${-c.pan[0] * ov}px)` }, { transform: `translateX(${-c.pan[1] * ov}px)` }], { duration: D, easing: 'linear', fill: 'forwards' });
  else {
    layer.style.transformOrigin = c.origin;
    const t0 = c.tilt ? ` translateY(${c.tilt[0]}%)` : '', t1 = c.tilt ? ` translateY(${c.tilt[1]}%)` : '';
    layer.animate([{ transform: `scale(${c.zoom[0]})${t0}` }, { transform: `scale(${c.zoom[1]})${t1}` }], { duration: D, easing: 'ease-out', fill: 'forwards' });
  }
  const fxs = c.fx || '';
  if (c.kind === 'video') { const v = layer.querySelector('video'); v.currentTime = 0; v.playbackRate = c.rate || 1; v.play().catch(() => {}); }
  if (fxs.includes('flash')) layer.animate([{ filter: 'sepia(.55) saturate(.7) brightness(.95) contrast(.95)' }, { filter: 'sepia(.55) saturate(.7) brightness(.95) contrast(.95)' }], { duration: D, fill: 'forwards' });
  if (fxs.includes('stone')) layer.animate([{ filter: 'sepia(.55) saturate(.7)' }, { filter: 'sepia(.2) saturate(0) brightness(.8)' }], { duration: ms, easing: 'ease-in', fill: 'forwards' });
  if (fxs === 'thaw') layer.animate([{ filter: 'grayscale(1) brightness(.8)' }, { filter: 'grayscale(1) brightness(.8)', offset: .25 }, { filter: 'grayscale(0) brightness(1)' }], { duration: ms, fill: 'forwards' });
  if (fxs === 'sweep') { const gl = layer.querySelector('.greyl'); gl.animate([{ clipPath: 'inset(0 0 0 0%)' }, { clipPath: 'inset(0 0 0 100%)' }], { duration: D, easing: 'linear', fill: 'forwards' }); }
  if (fxs === 'pink' || fxs === 'glow') el.querySelector('.pinkfill').animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: .9, transform: 'scale(1.4)' }], { duration: ms, easing: 'ease-in', fill: 'forwards' });
  if (fxs.includes('rise')) mode = 'rise';
  if (fxs.includes('rain')) mode += 'rain';
  if (fxs === 'wheel' || fxs === 'form') {
    const box = layer.querySelector('.wheelbox');
    if (!box.firstChild) wheels.push(startFateWheel(box, { id: 'w' + c.id, speed: reduce ? 0 : 9, glow: .6 }));
    if (fxs === 'form') {
      box.style.opacity = 0;
      later(() => {
        const tx = new DOMMatrix(getComputedStyle(layer).transform).m41;
        target = { x: c.wx * LW + tx, y: c.wy * screen.clientHeight };
        const w = screen.clientWidth, h = screen.clientHeight;
        for (let k = 0; k < (reduce ? 0 : 110); k++) parts.push({ t: 'form', x: Math.random() * w, y: h * (.3 + Math.random() * .7), vx: 0, vy: 0, life: 1, sz: 4 + Math.random() * 7, c: Math.random() < .3 ? '#fff6cf' : '#f2c55a' });
      }, 300);
      later(() => { flash.animate([{ opacity: 0 }, { opacity: .7, offset: .2 }, { opacity: 0 }], { duration: 600 }); box.animate([{ opacity: 0, transform: 'translate(-50%,-50%) scale(.6)' }, { opacity: 1, transform: 'translate(-50%,-50%) scale(1)' }], { duration: 700, fill: 'forwards', easing: 'cubic-bezier(.2,1.5,.4,1)' }); }, 2600);
    }
  }
  subtitle(c.text, ms);
  timer = setTimeout(() => show(i + 1), ms);
}
function showLogo(c, ms) {
  logo.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, fill: 'forwards' });
  if (!logo.wheel) logo.wheel = startFateWheel($('lw'), { id: 'lgw', speed: reduce ? 0 : 14, glow: .8 });
  const boxes = [...$('lreels').children], name = $('lname');
  name.classList.remove('on'); $('again').classList.remove('on');
  name.innerHTML = 'SLOT BATTLE<span class="end">THE END</span>';
  const spins = boxes.map((b, k) => { let n = k * 2; return setInterval(() => { b.innerHTML = icon(SYM[n++ % SYM.length]); }, 70); });
  timers.push(...spins);
  boxes.forEach((b, k) => later(() => { clearInterval(spins[k]); b.innerHTML = icon('heart'); b.animate([{ transform: 'scale(1.25)' }, { transform: 'none' }], { duration: 300 }); }, reduce ? 0 : 600 + k * 350));
  later(() => name.classList.add('on'), reduce ? 0 : 1800);
  subtitle(c.text, ms);
  timer = setTimeout(() => show(idx + 1), ms);
}
function end() {
  clear(); sub.classList.remove('on'); playing = false;
  const last = CUTS[CUTS.length - 1];
  if (last.kind !== 'logo') { els.forEach((e, k) => { if (k !== CUTS.length - 1) e.style.opacity = 0; }); }
  $('again').classList.add('on');
  if (last.kind !== 'logo') { logo.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, fill: 'forwards' }); $('lname').innerHTML = 'SLOT BATTLE'; $('lname').classList.add('on'); [...$('lreels').children].forEach(b => b.innerHTML = icon('heart')); if (!logo.wheel) logo.wheel = startFateWheel($('lw'), { id: 'lgw', speed: reduce ? 0 : 14, glow: .8 }); }
}
function begin() {
  $('start').style.display = 'none'; playing = true; parts = [];
  logo.animate([{ opacity: 0 }], { duration: 1, fill: 'forwards' });
  $('lname').classList.remove('on'); $('again').classList.remove('on');
  build(); requestAnimationFrame(() => show(0));
}
for (const b of $('scenes').children) b.addEventListener('click', () => {
  clear(); scene = b.dataset.s;
  for (const x of $('scenes').children) x.classList.toggle('on', x === b);
  $('startLabel').textContent = b.textContent.replace(/\s*\(.*\)/, '') + ' 재생';
  $('start').style.display = ''; playing = false; sub.classList.remove('on');
  logo.animate([{ opacity: 0 }], { duration: 1, fill: 'forwards' }); build();
});
build();
$('start').addEventListener('click', begin);
$('again').addEventListener('click', e => { e.stopPropagation(); begin(); });
$('skip').addEventListener('click', e => { e.stopPropagation(); if (playing) { const li = CUTS.findIndex(c => c.kind === 'logo'); li >= 0 && idx < li ? show(li) : end(); } });
let press = null;
screen.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; press = setTimeout(() => { press = 'long'; if (playing) end(); }, 650); });
screen.addEventListener('pointerup', e => {
  if (e.target.closest('button')) return;
  if (press === 'long') { press = null; return; }
  clearTimeout(press); press = null;
  if (playing) show(idx + 1);
});
addEventListener('keydown', e => { if (e.key === 'ArrowRight' && playing) show(idx + 1); });
}
</script>
