<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>SLOT BATTLE V2 - Mobile Rebuild</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1220;
      color: #e8eaf0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .phone {
      width: 375px;
      height: 720px;
      background: #15192b;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      border: 2px solid #2a2f45;
    }

    .top-bar {
      height: 52px;
      background: #1c2135;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid #2a2f45;
      z-index: 10;
      position: relative;
    }

    .top-bar span {
      background: #252b42;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .main-area {
      height: calc(100% - 52px - 64px);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: filter 0.35s ease;
    }

    .main-area.dimmed {
      filter: brightness(0.5);
    }

    .battle-zone {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1a1f35 0%, #12162a 100%);
    }

    .battle-placeholder {
      text-align: center;
      opacity: 0.65;
    }

    .battle-placeholder .icon { font-size: 42px; margin-bottom: 8px; }
    .battle-placeholder p { font-size: 14px; color: #9aa3c0; }

    .unit-board {
      height: 90px;
      background: #1a1f33;
      border-top: 1px solid #2a2f45;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      align-items: center;
    }

    .unit-board-label {
      font-size: 11px;
      color: #7a84a5;
      writing-mode: vertical-rl;
      margin-right: 4px;
      letter-spacing: 1px;
    }

    .unit-card {
      min-width: 62px;
      height: 70px;
      background: #252b42;
      border-radius: 10px;
      border: 1px solid #323a58;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      position: relative;
      animation: unitIn 0.35s ease;
    }

    .unit-card .name {
      font-size: 10px;
      color: #9aa3c0;
      margin-top: 2px;
    }

    .unit-card.new {
      border-color: #7b5cff;
      box-shadow: 0 0 10px rgba(123,92,255,0.45);
    }

    @keyframes unitIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .bottom-bar {
      height: 64px;
      background: #1c2135;
      border-top: 1px solid #2a2f45;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      position: relative;
    }

    .open-slot-btn {
      background: linear-gradient(135deg, #5b6cff, #7b5cff);
      color: white;
      border: none;
      padding: 12px 40px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(91,108,255,0.35);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 25;
    }
    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .slot-panel {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 68%;
      background: #1a1f35;
      border-radius: 22px 22px 0 0;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 30;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 36px rgba(0,0,0,0.5);
    }
    .slot-panel.open { transform: translateY(0); }

    .panel-handle {
      width: 36px; height: 4px;
      background: #3a415c;
      border-radius: 4px;
      margin: 10px auto 4px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 18px 10px;
      font-size: 13px;
      color: #9aa3c0;
    }

    .close-btn {
      background: #2a2f45;
      border: none;
      color: #c5cbe0;
      width: 30px; height: 30px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
    }

    .slot-body {
      display: flex;
      padding: 0 12px 0 16px;
      gap: 12px;
      flex: 1;
    }

    .slot-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      align-content: start;
    }

    .slot-cell {
      aspect-ratio: 1;
      background: #252b42;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      border: 2px solid #323a58;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .slot-cell.spinning {
      animation: cellSpin 0.45s ease;
    }

    .slot-cell.matched {
      border-color: #a78bfa;
      box-shadow: 0 0 14px rgba(167,139,250,0.55);
      transform: scale(1.04);
    }

    @keyframes cellSpin {
      0% { transform: scale(1); }
      35% { transform: scale(0.82) rotate(-8deg); }
      100% { transform: scale(1); }
    }

    /* 사이드 슬라이드 바 - 위에서 아래로 */
    .slide-bar-wrap {
      width: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .slide-label {
      font-size: 11px;
      color: #7a84a5;
      writing-mode: vertical-rl;
      letter-spacing: 2px;
    }

    .slide-track {
      width: 36px;
      height: 180px;
      background: #12162a;
      border-radius: 20px;
      border: 2px solid #2a2f45;
      position: relative;
      overflow: hidden;
    }

    .slide-fill {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 0%;
      background: linear-gradient(180deg, #5b6cff, #7b5cff);
      border-radius: 16px 16px 0 0;
      transition: height 0.05s linear;
    }

    .slide-thumb {
      position: absolute;
      left: 3px; right: 3px;
      height: 42px;
      background: #e8eaf0;
      border-radius: 14px;
      top: 4px;          /* 기본 위치: 위쪽 */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #1a1f35;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      cursor: grab;
      touch-action: none;
      transition: top 0.05s linear;
    }

    .slide-thumb:active { cursor: grabbing; }

    .slide-hint {
      font-size: 10px;
      color: #5a6480;
      text-align: center;
      line-height: 1.3;
    }

    .result-area {
      padding: 10px 16px 16px;
      min-height: 70px;
    }

    .spin-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #9aa3c0;
      margin-bottom: 8px;
    }

    .spin-info strong { color: #e8eaf0; }

    .summon-log {
      font-size: 13px;
      color: #c4b5fd;
      min-height: 20px;
      text-align: center;
    }

    .summon-log.success {
      animation: logPop 0.4s ease;
    }

    @keyframes logPop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .bottom-bar { gap: 10px; }
    .open-slot-btn { padding: 12px 26px; }
    .start-btn {
      background: #2a2f45; color: #e8eaf0; border: 1px solid #3a415c;
      padding: 12px 22px; border-radius: 24px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .start-btn:disabled { opacity: 0.45; cursor: default; }
    .battle-zone { position: relative; flex-direction: column; }
    .field { flex: 1; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; }
    .side { width: 46%; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-content: center; }
    .actor { width: 44px; text-align: center; }
    .actor .ico { font-size: 26px; transition: transform 0.1s; }
    .hp { height: 4px; background: #12162a; border-radius: 2px; overflow: hidden; margin-bottom: 2px; }
    .hp i { display: block; height: 100%; background: #4ade80; }
    .foe .hp i { background: #f87171; }
    .ally.hit .ico { transform: translateX(-5px); filter: brightness(2); }
    .foe.hit .ico { transform: translateX(5px); filter: brightness(2); animation: foeImpact .24s ease; }
    .ally.attack .ico { animation: allyStrike .28s ease-in-out; filter: brightness(1.35) drop-shadow(0 0 7px rgba(96,165,250,.9)); }
    @keyframes allyStrike { 0% { transform:translateX(0) scale(1); } 45% { transform:translateX(13px) scale(1.18); } 100% { transform:translateX(0) scale(1); } }
    @keyframes foeImpact { 0%,100% { transform:translateX(0); } 30% { transform:translateX(5px) scale(1.12); } 65% { transform:translateX(-4px); } }
    .battle-msg { font-size: 12px; color: #9aa3c0; text-align: center; padding: 8px 14px 12px; min-height: 40px; }
    .unit-card { animation: none; }
    .unit-card.new { animation: unitIn 0.35s ease; }

    .slot-cell { cursor: pointer; }
    .slot-cell.rolling { filter: blur(1.5px); border-color: #5b6cff; }
    .unit-card { cursor: pointer; }
    .unit-card.sel { border-color: #fbbf24; box-shadow: 0 0 10px rgba(251,191,36,0.5); }
    .unit-card .lv { font-size: 9px; color: #fbbf24; min-height: 11px; }

    .top-bar { padding: 0 8px; font-size: 12px; }
    .top-bar span { padding: 4px 8px; }
    .top-bar span span { padding: 0; background: none; border-radius: 0; }
    .shop-btn { width: 46px; height: 46px; border-radius: 50%; border: 1px solid #3a415c; background: #252b42; font-size: 20px; cursor: pointer; }
    .shop-tabs { display: flex; gap: 8px; padding: 0 16px 8px; }
    .tab { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid #323a58; background: #252b42; color: #9aa3c0; font-weight: 700; font-size: 13px; cursor: pointer; }
    .tab.on { background: #5b6cff; color: #fff; border-color: #5b6cff; }
    .shop-msg { font-size: 12px; color: #c4b5fd; text-align: center; min-height: 18px; padding: 0 16px 6px; }
    .shop-list { flex: 1; overflow-y: auto; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 8px; }
    .shop-row { display: flex; align-items: center; gap: 10px; background: #252b42; border: 1px solid #323a58; border-radius: 12px; padding: 10px 12px; }
    .shop-row .info { flex: 1; font-size: 13px; }
    .shop-row .info small { display: block; color: #7a84a5; font-size: 11px; margin-top: 2px; }
    .buy { background: #7b5cff; color: #fff; border: none; border-radius: 16px; padding: 8px 12px; font-weight: 700; font-size: 13px; cursor: pointer; min-width: 68px; }
    .buy:disabled { opacity: 0.4; cursor: default; }
    .inf { position: absolute; top: -2px; right: -2px; padding: 4px 6px; font-size: 10px; font-style: normal; color: #7a84a5; }
    .lk { position: absolute; top: 2px; left: 4px; font-size: 9px; font-style: normal; }
    .result-screen { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,0.72); display: none; align-items: center; justify-content: center; }
    .result-screen.show { display: flex; }
    .rs-card { background: #1a1f35; border: 1px solid #3a415c; border-radius: 18px; padding: 24px 28px; text-align: center; }
    .rs-card h2 { margin-bottom: 10px; } .rs-card p { color: #9aa3c0; font-size: 13px; margin-bottom: 16px; line-height: 1.6; }
    .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .pop { position: absolute; font-weight: 800; font-size: 14px; animation: popUp 0.7s ease-out forwards; text-shadow: 0 1px 3px #000; }
    @keyframes popUp { to { transform: translateY(-30px); opacity: 0; } }
    .tab { font-size: 12px; padding: 8px 4px; }
    .rs-card .shop-list { min-width: 250px; }

    /* ===== V2 MOBILE REBUILD ===== */
    :root { color-scheme: dark; }
    html, body { width:100%; height:100%; min-height:100%; }
    body {
      min-height:100dvh; height:100dvh; padding:0;
      background: radial-gradient(ellipse at 50% 0%, #202b4d 0%, #0b1020 62%);
      overscroll-behavior:none;
    }
    .phone {
      width:min(100vw, 480px);
      height:100dvh; max-height:100dvh;
      border:0; border-radius:0;
      display:flex; flex-direction:column;
      box-shadow:none;
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
    }
    .top-bar { flex:0 0 48px; height:48px; gap:4px; padding:0 7px; font-size:clamp(10px,2.8vw,12px); }
    .top-bar > span { padding:5px 6px; white-space:nowrap; }
    .main-area { height:auto; flex:1; min-height:0; }
    .battle-zone { min-height:0; overflow:hidden; }
    .field { min-height:0; padding:10px 8px; gap:4px; }
    .side { width:49%; gap:clamp(5px,1.5vw,10px); align-content:center; }
    .actor { width:clamp(38px,11vw,54px); }
    .actor .ico { font-size:clamp(23px,7vw,34px); line-height:1.2; }
    .hp { height:5px; }
    .battle-msg { min-height:38px; max-height:52px; overflow:auto; padding:7px 10px; }
    .unit-board { flex:0 0 88px; height:88px; min-height:88px; padding:7px 9px; gap:7px; }
    .unit-card { min-width:58px; height:70px; }
    .bottom-bar { flex:0 0 64px; height:64px; gap:7px; padding:0 8px; }
    .open-slot-btn { flex:1; min-width:0; padding:12px 8px; font-size:14px; }
    .start-btn { padding:11px 10px; font-size:13px; white-space:nowrap; }
    .shop-btn { flex:0 0 44px; width:44px; height:44px; }
    .slot-panel { height:min(78%, 690px); height:min(78dvh, 690px); padding-bottom:env(safe-area-inset-bottom); }
    .shop-panel { height:min(76dvh, 650px); }
    .slot-body { min-height:0; align-items:center; gap:10px; padding:0 12px; }
    .slot-grid { max-width:min(70vw, 330px); gap:clamp(5px,1.6vw,9px); }
    .slot-cell { min-width:0; font-size:clamp(23px,7vw,34px); border-radius:clamp(8px,2.5vw,13px); }
    .slide-bar-wrap { flex:0 0 44px; width:44px; }
    .slide-track { height:min(31vh, 210px); height:min(31dvh, 210px); width:34px; }
    .result-area { padding:8px 12px calc(12px + env(safe-area-inset-bottom)); }
    .rs-card { width:min(90%, 360px); max-height:85%; overflow:auto; padding:22px 18px; }
    .shop-list { overscroll-behavior:contain; }
    button { touch-action:manipulation; }
    .actor.hit .ico { animation: hitFlash .16s ease; }
    @keyframes hitFlash { 50% { transform:scale(1.2); filter:brightness(2.2); } }
    .actor.foe .ico { filter:drop-shadow(0 2px 5px rgba(248,113,113,.25)); }
    .actor.swift .ico { filter:drop-shadow(0 0 6px rgba(96,165,250,.8)); }
    .actor.tank .ico { filter:drop-shadow(0 0 7px rgba(251,191,36,.7)); transform:scale(1.08); }
    .actor.caster .ico { filter:drop-shadow(0 0 7px rgba(192,132,252,.8)); }
    .actor.boss .ico { font-size:clamp(31px,9vw,42px); filter:drop-shadow(0 0 9px rgba(248,113,113,.9)); }
    .actor.ally .ico { filter:drop-shadow(0 2px 5px rgba(74,222,128,.18)); }
    .slot-cell.matched { background:linear-gradient(145deg,#3b3265,#252b42); }
    .slot-panel, .shop-panel { overscroll-behavior:contain; }
    .board-tools { writing-mode:horizontal-tb; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-width:52px; margin:0; letter-spacing:0; }
    .absorb-toggle { border:1px solid #6d5ce7; background:#29234b; color:#d9d2ff; border-radius:8px; padding:5px 6px; font-size:9px; font-weight:800; white-space:nowrap; }
    .absorb-toggle.on { background:#6d5ce7; color:#fff; box-shadow:0 0 10px #6d5ce788; }
    .unit-card { touch-action:pan-y; }
    .unit-card.drag-source { opacity:.55; transform:scale(.94); }
    .unit-card.drop-target { border-color:#4ade80; box-shadow:0 0 12px #4ade8088; }
    .unit-board.absorb-mode .unit-card:not(.locked) { border-color:#7668cb; }
    .unit-board.absorb-mode .unit-card { touch-action:none; }
    .unit-card.locked { opacity:.72; }
    .absorb-hint { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(100% + 4px); font-size:10px; color:#c4b5fd; white-space:nowrap; pointer-events:none; }
    #absorbChoice { z-index:60; }
    #absorbChoice .rs-card { text-align:left; }
    #absorbChoice .rs-card h2, #absorbChoice .rs-card p { text-align:center; }
    .trait-choice-list { display:flex; flex-direction:column; gap:8px; width:100%; }
    .trait-choice { width:100%; border:1px solid #465078; border-radius:10px; padding:11px 12px; background:#252b42; color:#e8eaf0; text-align:left; font-size:13px; }
    .trait-choice small { display:block; color:#9aa3c0; margin-top:3px; }
    .trait-choice.convert { border-color:#8b75ff; background:#30275b; }
    .trait-choice.cancel { border-color:#596078; background:#20263a; text-align:center; }
    @media (min-width:600px) {
      .phone { width:min(100vw,480px); border-left:1px solid #303958; border-right:1px solid #303958; }
    }
    @media (max-height:650px) {
      .top-bar { flex-basis:42px; height:42px; }
      .unit-board { flex-basis:76px; height:76px; min-height:76px; }
      .bottom-bar { flex-basis:58px; height:58px; }
      .slide-track { height: min(25dvh,150px); }
      .slot-panel { height:84dvh; }
    }

  
    .dtab{flex:1;padding:8px 4px;border-radius:10px;border:1px solid #323a58;background:#252b42;color:#9aa3c0;font-weight:700;font-size:12px;cursor:pointer}
    .dtab.on{background:#5b6cff;color:#fff;border-color:#5b6cff}
    .lb-diff{display:flex;gap:6px;margin-bottom:10px}
    #lobby .rs-card{text-align:left} #lobby .rs-card h2,#lobby .rs-card p{text-align:center}
    .actor.elite .ico{filter:drop-shadow(0 0 6px #fbbf24)}
  
    .unit-card.empty{background:transparent;border:1px dashed #3a415c;color:#4b5578;font-size:18px}
    .unit-card.bench{border-style:dashed}
    .grp{font-size:10px;writing-mode:vertical-rl;letter-spacing:1px;color:#7a84a5;margin:0 2px 0 6px;white-space:nowrap}
    .grp.f{color:#f59e0b}.grp.b{color:#60a5fa}.grp.w{color:#a78bfa}
    .acol{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;width:48%}
  
    .unit-card.adv{border-color:#fbbf24;box-shadow:0 0 10px rgba(251,191,36,.45);background:linear-gradient(#34301f,#252b42)}
    .unit-card .vr{font-size:8px;color:#4ade80;margin-left:2px}.unit-card .vr.dn{color:#f87171}
    .actor.advfx .ico{filter:drop-shadow(0 0 7px #fbbf24)}
  
    .unit-card.leg{border-color:#c084fc;box-shadow:0 0 12px rgba(192,132,252,.65);background:linear-gradient(135deg,#3a2150,#1f3a4d)}
    .actor.legfx .ico{filter:drop-shadow(0 0 9px #c084fc)}
    .jp-fx{position:absolute;inset:0;z-index:55;pointer-events:none;display:none;align-items:center;justify-content:center;font-weight:900;font-size:36px;color:#fff;text-shadow:0 0 18px #fbbf24;text-align:center;line-height:1.3}
    .jp-fx.show{display:flex;animation:jpFlash 1.5s ease-out forwards}
    .jp-fx.prism span{background:linear-gradient(90deg,#f87171,#fbbf24,#4ade80,#60a5fa,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 10px #c084fc)}
    @keyframes jpFlash{0%{background:rgba(255,255,255,.9);transform:scale(.6);opacity:1}35%{background:rgba(251,191,36,.28);transform:scale(1.12)}100%{background:transparent;transform:scale(1);opacity:0}}
  </style>
</head>
<body>
  <div class="phone">
    <div class="top-bar">
      <span>💰 <span id="gold">1250</span></span>
      <span>Wave <span id="wave">1</span></span>
      <span>🏰 <span id="baseHp">100</span></span>
      <span>유닛 <span id="unitCount">0</span>/<span id="maxUnits">5</span></span>
      <span>💎 <span id="ruby">0</span></span>
    </div>

    <div class="main-area" id="mainArea">
      <div class="battle-zone">
        <div class="field" id="field"></div>
        <div class="battle-msg" id="battleMsg"></div>
        <div class="fx" id="fx"></div>
      </div>

      <div class="unit-board" id="unitBoard">
        <div class="unit-board-label">BOARD</div>
      </div>
    </div>

    <div class="bottom-bar">
      <button class="open-slot-btn" id="openBtn">슬롯 열기</button>
      <button class="start-btn" id="startBtn">▶ 웨이브 시작</button>
      <button class="shop-btn" id="shopBtn">🛒</button>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="slot-panel shop-panel" id="shopPanel">
      <div class="panel-handle"></div>
      <div class="panel-header"><span>SHOP · 💎 <b id="rubyShop">0</b></span><button class="close-btn" id="shopClose">✕</button></div>
      <div class="shop-tabs">
        <button class="tab on" data-tab="items">아이템</button>
        <button class="tab" data-tab="upg">업그레이드</button>
        <button class="tab" data-tab="dex">도감</button>
      </div>
      <div class="shop-msg" id="shopMsg"></div>
      <div class="shop-list" id="shopList"></div>
    </div>

    <div class="slot-panel shop-panel" id="detailPanel">
      <div class="panel-handle"></div>
      <div class="panel-header"><span>UNIT DETAIL</span><button class="close-btn" id="detailClose">✕</button></div>
      <div class="shop-msg" id="detailMsg"></div>
      <div class="shop-list" id="detailBody"></div>
    </div>

    <div class="result-screen" id="absorbChoice">
      <div class="rs-card">
        <h2>✨ 특성 계승</h2>
        <p id="absorbChoiceText">희생 유닛의 특성을 선택하세요.</p>
        <div class="trait-choice-list" id="absorbChoiceList"></div>
      </div>
    </div>

    <div class="result-screen" id="resultScreen">
      <div class="rs-card"><h2 id="rsTitle">GAME OVER</h2><p id="rsText"></p><button class="start-btn" id="rsNext" style="display:none">다음 스테이지</button> <button class="start-btn" id="rsBtn">다시 시작</button> <button class="start-btn" id="rsLobby">로비</button></div>
    </div>

    <div class="result-screen" id="coreScreen">
      <div class="rs-card"><h2>Core 선택</h2><p>이번 판의 규칙을 바꿔요</p><div id="coreList" class="shop-list"></div></div>
    </div>

    <div class="result-screen show" id="lobby">
      <div class="rs-card"><h2>🎰 SLOT BATTLE</h2><p id="lbText"></p><div class="lb-diff" id="lbDiff"></div><div class="shop-list" id="lbStages"></div></div>
    </div>

    <div class="jp-fx" id="jpFx"></div>

    <div class="slot-panel" id="slotPanel">
      <div class="panel-handle"></div>
      <div class="panel-header">
        <span>SLOT MACHINE</span>
        <button class="close-btn" id="closeBtn">✕</button>
      </div>

      <div class="slot-body">
        <div class="slot-grid" id="slotGrid">
          <div class="slot-cell" data-idx="0">🗡️</div>
          <div class="slot-cell" data-idx="1">🏹</div>
          <div class="slot-cell" data-idx="2">🔮</div>
          <div class="slot-cell" data-idx="3">🗡️</div>
          <div class="slot-cell" data-idx="4">🛡️</div>
          <div class="slot-cell" data-idx="5">🏹</div>
          <div class="slot-cell" data-idx="6">🔮</div>
          <div class="slot-cell" data-idx="7">🗡️</div>
          <div class="slot-cell" data-idx="8">🏹</div>
        </div>

        <!-- 사이드 슬라이드 바 : 위에서 아래로 -->
        <div class="slide-bar-wrap">
          <div class="slide-label">PULL</div>
          <div class="slide-track" id="slideTrack">
            <div class="slide-fill" id="slideFill"></div>
            <div class="slide-thumb" id="slideThumb">↓</div>
          </div>
          <div class="slide-hint">아래로<br>내리세요</div>
        </div>
      </div>

      <div class="result-area">
        <div class="spin-info">
          <div>비용 <strong id="costEl">100</strong></div>
          <div>남은 횟수 <strong id="remainSpin">5</strong></div>
        </div>
        <div class="summon-log" id="summonLog">슬라이드 바를 아래로 내려 스핀하세요</div>
      </div>
    </div>
  </div>

  <script>
    const BENCH_MAX = 4, FRONT_MAX = 3, MELEE = ['Warrior', 'Guard', 'Cavalry'];
    const SPIN_COST = 100, NUDGE_COST = 50, MAX_UNITS = 5, MAX_LV = 15;

    // 심볼 = 유닛 원형 데이터 (hp / atk / spd = 공격 간격(초))
    const SYMBOLS = [
      { icon: '🗡️', name: 'Warrior', weight: 22, hp: 60,  atk: 8,  spd: 1.0 },
      { icon: '🏹', name: 'Archer',  weight: 22, hp: 35,  atk: 10, spd: 0.8 },
      { icon: '🛡️', name: 'Guard',   weight: 18, hp: 100, atk: 4,  spd: 1.2 },
      { icon: '🔮', name: 'Mage',    weight: 16, hp: 30,  atk: 14, spd: 1.5 },
      { icon: '🐴', name: 'Cavalry', need: 3, weight: 12, hp: 70,  atk: 12, spd: 1.0 },
      { icon: '⭐', name: 'Special', need: 6, weight: 10, hp: 50,  atk: 16, spd: 1.0 },
      { icon: '🌈', name: 'Prism',   need: 3, weight: 3,  prism: true, hp: 0, atk: 0, spd: 1 }, // 와일드: 줄을 완성하면 전설 유닛
    ];

    const PAYLINES = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    // 게임 상태는 한 객체로 관리 (phase: prep / fight / over)
    const G = { stage: 0, diff: 0, gold: 0, spins: 0, wave: 1, baseHp: 100, phase: 'prep', spinning: false, units: [], bench: [], enemies: [] };

    const openBtn = document.getElementById('openBtn');
    const closeBtn = document.getElementById('closeBtn');
    const slotPanel = document.getElementById('slotPanel');
    const overlay = document.getElementById('overlay');
    const mainArea = document.getElementById('mainArea');
    const cells = document.querySelectorAll('.slot-cell');
    const unitBoard = document.getElementById('unitBoard');
    const summonLog = document.getElementById('summonLog');
    const goldEl = document.getElementById('gold');
    const unitCountEl = document.getElementById('unitCount');
    const remainSpinEl = document.getElementById('remainSpin');

    const slideTrack = document.getElementById('slideTrack');
    const slideThumb = document.getElementById('slideThumb');
    const slideFill = document.getElementById('slideFill');

    function openPanel() {
      slotPanel.classList.add('open');
      overlay.classList.add('show');
      mainArea.classList.add('dimmed');
    }
    function closePanel() {
      slotPanel.classList.remove('open');
      overlay.classList.remove('show');
      mainArea.classList.remove('dimmed');
      resetSlide();
    }

    openBtn.addEventListener('click', openPanel);
    closeBtn.addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);

    // ========== 슬라이드 바 (위에서 아래로) ==========
    let dragging = false;
    let startY = 0;
    let currentPull = 0; // 0(위) ~ 1(아래)

    const TRACK_HEIGHT = 180;
    const THUMB_HEIGHT = 42;
    const MAX_TRAVEL = TRACK_HEIGHT - THUMB_HEIGHT - 8;

    function setPull(ratio) {
      ratio = Math.max(0, Math.min(1, ratio));
      currentPull = ratio;
      const top = 4 + ratio * MAX_TRAVEL;
      slideThumb.style.top = top + 'px';
      slideFill.style.height = (ratio * 100) + '%';
    }

    function resetSlide() {
      setPull(0);
      slideThumb.textContent = '↓';
    }

    function onStart(clientY) {
      if (G.spinning) return;
      dragging = true;
      startY = clientY;
      slideThumb.style.transition = 'none';
      slideFill.style.transition = 'none';
    }

    function onMove(clientY) {
      if (!dragging) return;
      const delta = clientY - startY; // 아래로 내리면 양수
      const ratio = delta / MAX_TRAVEL;
      setPull(ratio);
    }

    function onEnd() {
      if (!dragging) return;
      dragging = false;
      slideThumb.style.transition = 'top 0.2s ease';
      slideFill.style.transition = 'height 0.2s ease';

      if (currentPull >= 0.85 && doSpin()) {
        slideThumb.textContent = '✓';
      } else {
        resetSlide();
      }
    }

    // 마우스
    slideThumb.addEventListener('mousedown', e => {
      e.preventDefault();
      onStart(e.clientY);
    });
    window.addEventListener('mousemove', e => onMove(e.clientY));
    window.addEventListener('mouseup', onEnd);

    // 터치
    slideThumb.addEventListener('touchstart', e => {
      e.preventDefault();
      onStart(e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if (dragging) {
        e.preventDefault();
        onMove(e.touches[0].clientY);
      }
    }, { passive: false });

    window.addEventListener('touchend', onEnd);

    // ========== 유틸 / HUD ==========
    const $ = id => document.getElementById(id);
    const field = $('field'), battleMsg = $('battleMsg'), startBtn = $('startBtn');
    let timer = null;

    function say(t, ok) {
      summonLog.textContent = t;
      summonLog.classList.remove('success');
      if (ok) { void summonLog.offsetWidth; summonLog.classList.add('success'); }
    }
    function updateHud() {
      goldEl.textContent = G.gold;
      remainSpinEl.textContent = G.spins;
      unitCountEl.textContent = G.units.length + (G.bench.length ? ' (+' + G.bench.length + ')' : '');
      $('wave').textContent = G.stage >= 0 ? G.wave + '/' + WAVES : G.wave + ' ♾️';
      $('baseHp').textContent = Math.max(0, Math.ceil(G.baseHp));
      $('ruby').textContent = META.ruby;
      $('costEl').textContent = spinCost();
      $('maxUnits').textContent = maxUnits();
    }

    // ========== 스핀 + 판정 + 소환 ==========
    function weightedRandom(noPrism) {
      const pool = SYMBOLS.filter(x => META.best >= (x.need || 0) && !(noPrism && x.prism)); // 최고 웨이브로 해금
      const w = x => x.weight * (G.core === 'lucky' && x.name === 'Special' ? 2 : 1);
      let r = Math.random() * pool.reduce((a, x) => a + w(x), 0);
      for (const x of pool) { r -= w(x); if (r <= 0) return x; }
      return pool[0];
    }

    function drawGrid() { cells.forEach((c, i) => c.textContent = G.grid[i].icon); }

    // 현재 그리드의 매칭 판정 + 소환. 매칭된 줄 수를 반환
    function jackpotFx(text, prism) {
      const el = $('jpFx'); el.className = 'jp-fx' + (prism ? ' prism' : '');
      el.innerHTML = `<span>${text}</span>`; void el.offsetWidth; el.classList.add('show');
      try { navigator.vibrate && navigator.vibrate(prism ? [90, 40, 90, 40, 160] : [70, 30, 110]); } catch (e) {}
      clearTimeout(jackpotFx.t); jackpotFx.t = setTimeout(() => el.classList.remove('show'), 1500);
    }
    function evalGrid() {
      const g = G.grid, lines = [], idx = new Set();
      PAYLINES.forEach(([a, b, c]) => {
        const real = [g[a], g[b], g[c]].filter(x => !x.prism); // Prism = 와일드
        if (real.length && !real.every(x => x.name === real[0].name)) return;
        lines.push(real.length === 3 ? { sym: real[0] } : { prism: true });
        [a, b, c].forEach(i => idx.add(i));
      });
      cells.forEach((c, i) => c.classList.toggle('matched', idx.has(i)));
      if (!lines.length) return 0;
      const jackpot = lines.length >= 2;
      let n = 0, legends = 0, forceAdv = jackpot;
      lines.forEach(l => {
        if (l.prism) { if (summonLegend()) { n++; legends++; } }
        else if (summonUnit(l.sym, forceAdv ? { adv: true } : undefined)) { n++; forceAdv = false; }
      });
      if (lines.length >= 3) G.spins += 2;
      if (legends) jackpotFx('🌈 PRISM!<br>전설 유닛 소환', true);
      else if (jackpot) jackpotFx(lines.length >= 3 ? '🎰 MEGA JACKPOT!' : '🎰 JACKPOT!', false);
      say(`${lines.length}줄 매칭! ` + (n < lines.length ? `자리가 부족해 ${n}기만 소환` : `${n}기 소환`) + (legends ? ' · 🌈 전설 유닛!' : '') + (jackpot ? ' · ✨ 잭팟 보너스' + (lines.length >= 3 ? ' (스핀 +2)' : '') : ''), n > 0);
      updateHud();
      return lines.length;
    }

    // 스핀이 시작되면 true, 거절되면 false (이유는 로그로 안내)
    function doSpin() {
      if (G.spinning || G.phase === 'over') return false;
      if (G.spins <= 0) { say('남은 횟수가 없어요. 웨이브를 클리어하면 충전됩니다'); return false; }
      if (G.gold < spinCost()) { say('골드가 부족해요'); return false; }
      if (G.units.length >= maxUnits() && G.bench.length >= BENCH_MAX) { say('보드와 대기석이 가득 찼어요 · 흡수로 자리를 비우세요'); return false; }

      G.spinning = true; G.nudge = false;
      G.gold -= spinCost(); G.spins -= 1;
      updateHud(); say('스핀 중...');
      cells.forEach(c => c.classList.remove('matched'));

      // 결과를 먼저 정하고, 릴이 열 단위로 차례대로 멈추는 연출
      const result = Array.from({ length: 9 }, () => weightedRandom());
      cells.forEach((cell, i) => {
        cell.classList.add('rolling');
        const iv = setInterval(() => { cell.textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)].icon; }, 70);
        setTimeout(() => {
          clearInterval(iv);
          cell.classList.remove('rolling');
          cell.textContent = result[i].icon;
          cell.classList.add('spinning');
          setTimeout(() => cell.classList.remove('spinning'), 400);
        }, 450 + (i % 3) * 220);
      });

      setTimeout(() => {
        G.grid = result;
        if (!evalGrid()) { G.nudge = true; say(`매칭 없음 · 칸을 탭하면 그 열이 한 칸 내려가요 (넛지 -${NUDGE_COST})`); }
        G.spinning = false;
        setTimeout(resetSlide, 400);
      }, 450 + 2 * 220 + 200);
      return true;
    }

    // 넛지: 매칭 실패 직후 1회, 탭한 칸의 열을 한 칸 내리고 맨 위에 새 심볼
    function nudge(i) {
      if (!G.nudge || G.spinning) return;
      if (G.gold < NUDGE_COST) { say('골드가 부족해요'); return; }
      G.gold -= NUDGE_COST; G.nudge = false;
      const c = i % 3, g = G.grid;
      g[c + 6] = g[c + 3]; g[c + 3] = g[c]; g[c] = weightedRandom();
      drawGrid(); updateHud();
      [c, c + 3, c + 6].forEach(k => { cells[k].classList.add('spinning'); setTimeout(() => cells[k].classList.remove('spinning'), 400); });
      if (!evalGrid()) say('넛지 실패…');
    }
    cells.forEach((el, i) => el.addEventListener('click', () => nudge(i)));

    // ========== 배치 / 대기석 ==========
    // 인덱스 100 이상 = 대기석(bench). 전열(F) 최대 3, 후열(B) = 최대유닛 - 3
    const getU = i => i >= 100 ? G.bench[i - 100] : G.units[i];
    const rowCount = r => G.units.filter(u => (u.row || 'F') === r).length;
    const rowCap = r => r === 'F' ? FRONT_MAX : Math.max(0, maxUnits() - FRONT_MAX);
    function removeU(i) { if (i >= 100) G.bench.splice(i - 100, 1); else G.units.splice(i, 1); }
    function swapPlaces(a, b) {
      const A = getU(a), B = getU(b); if (!A || !B) return;
      if (a >= 100 && b >= 100) { G.bench[a - 100] = B; G.bench[b - 100] = A; }
      else if (a < 100 && b < 100) { const t = A.row; A.row = B.row; B.row = t; }
      else {
        const bi = (a >= 100 ? b : a), wi = (a >= 100 ? a : b) - 100;
        const fu = G.units[bi], wu = G.bench[wi];
        wu.row = fu.row; G.units[bi] = wu; G.bench[wi] = fu;
      }
    }
    function placeUnit(i, row) {
      const u = getU(i); if (!u) return;
      if (row === 'W') {
        if (i >= 100) return;
        if (G.bench.length >= BENCH_MAX) { battleMsg.textContent = '대기석이 가득 찼어요'; return; }
        G.units.splice(i, 1); G.bench.push(u);
      } else if (i >= 100) {
        if (G.units.length >= maxUnits()) { battleMsg.textContent = '보드가 가득 찼어요 · 유닛과 자리를 바꾸세요'; return; }
        if (rowCount(row) >= rowCap(row)) { battleMsg.textContent = '그 줄이 가득 찼어요'; return; }
        G.bench.splice(i - 100, 1); u.row = row; G.units.push(u);
      } else {
        if ((u.row || 'F') === row) { sel = -1; renderBoard(); return; }
        if (rowCount(row) >= rowCap(row)) { battleMsg.textContent = '그 줄이 가득 찼어요 · 유닛끼리 탭해서 바꾸세요'; return; }
        u.row = row;
      }
      sel = -1; renderBoard(); renderField(); updateHud();
    }
    function formationTap(i) {
      if (sel < 0) sel = i;
      else if (sel === i) sel = -1;
      else { swapPlaces(sel, i); sel = -1; renderField(); updateHud(); }
      battleMsg.textContent = sel >= 0 ? '옮길 자리(다른 유닛 또는 빈 칸)를 탭하세요' : '배치를 바꿨어요';
      renderBoard();
    }
    function pickTarget(e, st) {
      const F = G.units.filter(u => (u.row || 'F') !== 'B'), B = G.units.filter(u => u.row === 'B');
      if (st.rand) return G.units[Math.floor(Math.random() * G.units.length)];
      if (e.role === 'swift' && B.length && Math.random() < 0.4) return B[Math.floor(Math.random() * B.length)]; // 날쌘 적: 후열 급습
      return (F.length ? F : B)[0];
    }

    function summonLegend() {
      const owned = new Set([...G.units, ...G.bench].filter(u => u.leg).map(u => u.name));
      const pool = LEGENDS.filter(l => !owned.has(l.name));
      const pick = (pool.length ? pool : LEGENDS)[Math.floor(Math.random() * (pool.length || LEGENDS.length))];
      return summonUnit(Object.assign({ leg: true }, pick));
    }
    function summonUnit(sym, opts) {
      const toBoard = G.units.length < maxUnits();
      if (!toBoard && G.bench.length >= BENCH_MAX) return false;
      const adv = !!sym.leg || !!(opts && opts.adv) || Math.random() < ADV_RATE;
      const nu = { icon: sym.icon, name: sym.name, hp0: sym.hp, atk0: sym.atk, spd: sym.spd, lv: 0, imp: 0, traits: pickTraits(adv ? 2 : 1), adv, leg: !!sym.leg, ask: adv ? ADV[sym.name].cd : 0, vh: rollV(adv), va: rollV(adv), sub: null, awake: false, lock: false, sk: 4, cd: 0, isNew: true,
        row: rowCount('F') < FRONT_MAX ? 'F' : 'B' };
      (toBoard ? G.units : G.bench).push(nu);
      applyStats(nu); dexAdd('u', nu.name); nu.traits.forEach(t => dexAdd('t', t));
      if (nu.leg) { dexAdd('l', nu.name); battleMsg.textContent = `🌈 전설 ${nu.icon} ${nu.name} 소환! 전용 스킬 ‘${ADV[nu.name].n}’`; }
      else if (adv) { dexAdd('a', nu.name); battleMsg.textContent = `✨ Advanced ${nu.name} 소환! 전용 스킬 ‘${ADV[nu.name].n}’`; }
      renderBoard();
      nu.isNew = false;
      updateHud();
      renderField();
      return true;
    }

    // ========== 흡수 (Absorb) ==========
    // 드래그/탭으로 희생 유닛을 대상 유닛에 흡수하고 특성은 플레이어가 선택
    let sel = -1, absorbMode = false, pendingAbsorb = null;
    const starOf = u => Math.min(3, Math.floor(u.lv / 3));
    function applyStats(u) {
      const oldMax = u.maxHp || 0;
      const oldHp = Number.isFinite(u.hp) ? u.hp : oldMax;
      const hpRatio = oldMax > 0 ? Math.max(0, Math.min(1, oldHp / oldMax)) : 1;
      const t = u.traits.map(i => TRAITS[i]), sb = u.sub ? SUBS[u.sub] : {};
      const prod = k => t.reduce((a, x) => a * (x[k] || 1), 1);
      const m = (1 + 0.2 * u.lv + 0.04 * u.imp) * (1 + 0.3 * starOf(u)) * (u.awake ? 1.5 : 1);
      u.maxHp = Math.round(u.hp0 * m * prod('hp') * (sb.hp || 1) * (1 + 0.05 * META.up.hp) * (u.vh || 1) * (u.adv ? 1.25 : 1));
      u.atk = Math.round(u.atk0 * m * prod('atk') * (sb.atk || 1) * (1 + 0.05 * META.up.atk) * (u.va || 1) * (u.adv ? 1.25 : 1) * 10) / 10;
      u.spdM = prod('spd');
      u.steal = t.reduce((a, x) => a + (x.steal || 0), 0) + (u.leg && u.name === 'Vampire' ? 0.5 : 0);
      u.burn = t.reduce((a, x) => a + (x.burn || 0), 0);
      const sum = k => t.reduce((a, x) => a + (x[k] || 0), 0);
      u.crit = sum('crit'); u.dodge = sum('dodge'); u.thorns = sum('thorns'); u.exec = sum('exec');
      u.shieldP = sum('shieldP'); u.rage = sum('rage'); u.regen = sum('regen'); u.cleave = sum('cleave'); u.firstS = t.some(x => x.first);
      u.hp = Math.min(u.maxHp, Math.round(u.maxHp * hpRatio));
    }
    function setAbsorbMode(on) {
      absorbMode = !!on; sel = -1;
      unitBoard.classList.toggle('absorb-mode', absorbMode);
      renderBoard();
      battleMsg.textContent = absorbMode ? '흡수 모드: 희생 유닛을 강화할 유닛 위로 드래그하세요' : '흡수 모드를 종료했습니다';
    }
    function beginAbsorb(targetIndex, foodIndex) {
      if (G.phase === 'fight') { battleMsg.textContent = '전투 중에는 흡수할 수 없어요'; return; }
      if (targetIndex === foodIndex) return;
      const k = getU(targetIndex), f = getU(foodIndex);
      if (!k || !f) return;
      if (f.lock) { battleMsg.textContent = '🔒 잠긴 유닛은 희생시킬 수 없어요'; return; }
      if (k.lv >= MAX_LV) { battleMsg.textContent = '대상 유닛이 이미 최대 레벨입니다'; return; }
      const oldStar = starOf(k), gain = k.name === f.name ? 2 : 1;
      // 대상이 이미 가진 특성과 겹치는 특성은 성장치로 환산, 새 특성은 선택권 제공
      const incoming = [...new Set((f.traits || []).filter(t => !k.traits.includes(t)))];
      const duplicates = (f.traits || []).filter(t => k.traits.includes(t)).length;
      k.lv = Math.min(MAX_LV, k.lv + gain);
      k.imp += 1 + (f.imp || 0) + duplicates;
      while (k.imp >= 5 && k.lv < MAX_LV) { k.imp -= 5; k.lv = Math.min(MAX_LV, k.lv + 1); }
      removeU(foodIndex);
      sel = -1;
      applyStats(k);
      pendingAbsorb = { unit:k, incoming, oldStar, gain, name:f.name, duplicateCount:duplicates };
      updateHud(); renderBoard(); renderField();
      if (incoming.length) showAbsorbChoices();
      else finishAbsorb(null);
    }
    function showAbsorbChoices() {
      const p = pendingAbsorb; if (!p) return;
      const list = $('absorbChoiceList'); list.innerHTML = '';
      $('absorbChoiceText').textContent = p.unit.traits.length < traitCap(p.unit) ? '계승할 특성을 선택하세요.' : '특성 슬롯이 가득 찼습니다. 교체하거나 성장치로 전환하세요.';
      p.incoming.forEach(t => {
        const b = document.createElement('button'); b.className = 'trait-choice';
        b.innerHTML = `✨ ${TRAITS[t].n}<small>${TRAITS[t].d}</small>`;
        b.addEventListener('click', () => finishAbsorb({ type:'add', trait:t })); list.appendChild(b);
      });
      if (p.unit.traits.length >= traitCap(p.unit)) {
        p.unit.traits.forEach((old, idx) => {
          p.incoming.forEach(t => {
            const b = document.createElement('button'); b.className = 'trait-choice';
            b.innerHTML = `교체: ${TRAITS[old].n} → ${TRAITS[t].n}<small>${TRAITS[t].d}</small>`;
            b.addEventListener('click', () => finishAbsorb({ type:'replace', index:idx, trait:t })); list.appendChild(b);
          });
        });
      }
      const convert = document.createElement('button'); convert.className = 'trait-choice convert';
      convert.innerHTML = '⬆ 성장치로 전환<small>새 특성을 배우지 않고 흡수 성장치를 추가합니다.</small>';

    function finishAbsorb(choice) {
      const p = pendingAbsorb; if (!p) return;

      else if (choice?.type === 'replace') { const old = u.traits[choice.index]; u.traits[choice.index] = choice.trait; note = ` · ${TRAITS[old].n} → ${TRAITS[choice.trait].n}`; }
      else if (choice?.type === 'convert') { u.imp += 2; while (u.imp >= 5 && u.lv < MAX_LV) { u.imp -= 5; u.lv = Math.min(MAX_LV, u.lv + 1); } note = ' · 특성 대신 성장치 전환'; }
      applyStats(u);
      $('absorbChoice').classList.remove('show');
      battleMsg.textContent = `${p.name} 흡수 완료! ${u.name} Lv ${u.lv}` + (starOf(u) > p.oldStar ? ` · ★${starOf(u)} 승급!` : '') + note;
      pendingAbsorb = null; renderBoard(); updateHud(); renderField();
    }
    let suppressBoardClickUntil = 0;
    unitBoard.addEventListener('click', e => {

      if (card && e.target.closest('.inf')) { detIdx = +card.dataset.i; openDetail(); return; }
      if (!card) return;
      if (G.phase === 'fight') { battleMsg.textContent = '전투 중에는 배치·흡수할 수 없어요'; return; }
      if (card.classList.contains('empty')) { if (!absorbMode && sel >= 0) placeUnit(sel, card.dataset.row); return; }
      if (!absorbMode) { formationTap(+card.dataset.i); return; }
      const i = +card.dataset.i, u = getU(i);
      if (!u) return;
      if (sel < 0) { if (u.lock) { battleMsg.textContent = '잠긴 유닛은 희생 재료로 선택할 수 없습니다'; return; } sel = i; }
      else if (sel === i) sel = -1;
      else { const source = sel; sel = -1; beginAbsorb(i, source); return; }
      battleMsg.textContent = sel >= 0 ? '이제 강화할 대상 유닛을 탭하세요' : '희생 유닛을 선택하거나 드래그하세요';
      renderBoard();
    });
    let dragInfo = null;
    unitBoard.addEventListener('pointerdown', e => {
      if (!absorbMode || G.phase === 'fight') return;
      const card = e.target.closest('.unit-card'); if (!card || e.target.closest('.inf')) return;
      const i = Number(card.dataset.i), u = getU(i); if (!u || u.lock) return;
      dragInfo = { index:i, x:e.clientX, y:e.clientY, moved:false };
    });
    document.addEventListener('pointermove', e => {
      if (!dragInfo) return;
      if (Math.hypot(e.clientX-dragInfo.x,e.clientY-dragInfo.y)>10) dragInfo.moved=true;
      if (dragInfo.moved) { const card = unitBoard.querySelector(`.unit-card[data-i="${dragInfo.index}"]`); if(card) card.classList.add('drag-source'); }
    });
    document.addEventListener('pointerup', e => {
      if (!dragInfo) return; const d=dragInfo; dragInfo=null;
      if (!d.moved) return;
      suppressBoardClickUntil = Date.now() + 450;
      const target = document.elementFromPoint(e.clientX,e.clientY)?.closest?.('.unit-card');
      unitBoard.querySelectorAll('.drag-source').forEach(x=>x.classList.remove('drag-source'));
      if (!target) return; const targetIndex=Number(target.dataset.i);

    });
    function renderBoard() {
      const card = (u, i, bench) => `<div class="unit-card${bench ? ' bench' : ''}${u.adv ? ' adv' : ''}${u.leg ? ' leg' : ''}${u.isNew ? ' new' : ''}${i === sel ? ' sel' : ''}${u.lock ? ' locked' : ''}" data-i="${i}" title="${u.lock ? '잠금됨' : '유닛'}"><i class="inf">ⓘ</i>${u.lock ? '<i class="lk">🔒</i>' : ''}${u.icon}<div class="name">${u.leg ? '🌈' : u.adv ? '✨' : ''}${u.name}</div><div class="lv">${u.lv ? 'Lv' + u.lv : ''}${starOf(u) ? ' ' + '★'.repeat(starOf(u)) : ''}${vrTag(u)}</div></div>`;
      const empties = (n, r) => Array.from({ length: Math.max(0, n) }, () => `<div class="unit-card empty" data-row="${r}">＋</div>`).join('');
      const row = r => { const us = G.units.map((u, i) => [u, i]).filter(([u]) => (u.row || 'F') === r); return us.map(([u, i]) => card(u, i, false)).join('') + empties(rowCap(r) - us.length, r); };
      unitBoard.innerHTML = `<div class="unit-board-label board-tools"><span>BOARD</span><button class="absorb-toggle ${absorbMode ? 'on' : ''}" id="absorbToggle">흡수 ${absorbMode ? 'ON' : 'OFF'}</button></div>` +
        `<div class="grp f">전열</div>${row('F')}<div class="grp b">후열</div>${row('B')}` +
        `<div class="grp w">대기 ${G.bench.length}/${BENCH_MAX}</div>${G.bench.map((u, j) => card(u, 100 + j, true)).join('')}${empties(BENCH_MAX - G.bench.length, 'W')}`;
      unitBoard.classList.toggle('absorb-mode', absorbMode);
    }
    function actorHtml(a, cls) {
      const hit = performance.now() - (a.hitAt || 0) < 150;
      const role = (a.role ? ` ${a.role}` : '') + (a.elite ? ' elite' : '') + (a.adv ? ' advfx' : '') + (a.leg ? ' legfx' : '');
      const attacking = cls === 'ally' && performance.now() - (a.attackAt || 0) < 280;
      return `<div class="actor ${cls}${role}${hit ? ' hit' : ''}${attacking ? ' attack' : ''}"><div class="hp"><i style="width:${Math.max(0, a.hp / a.maxHp * 100)}%"></i></div><div class="ico">${a.icon}</div></div>`;
    }

      field.innerHTML = `<div class="side" style="flex-wrap:nowrap;gap:10px"><div class="acol">${arow('B')}</div><div class="acol">${arow('F')}</div></div>` +
                        `<div class="side">${G.enemies.map(e => actorHtml(e, 'foe')).join('')}</div>`;
    }

    // ========== 스테이지 / 난이도 데이터 ==========
    const WAVES = 10;
    const DIFFS = [{ n: 'Easy', hp: 0.8, atk: 0.8, rw: 1 }, { n: 'Normal', hp: 1, atk: 1, rw: 1.6 }, { n: 'Hard', hp: 1.5, atk: 1.35, rw: 2.5 }];
    // roster: [아이콘, HP배율, ATK배율, 공격간격, 역할]
    const STAGES = [
      { n: '잊혀진 숲', ic: '🌲', rule: '빠른 적이 떼로 몰려옴', cnt: 1.3, spdM: 0.85,
        roster: [['🧌', 1, 1, 1.2, 'grunt'], ['🐺', 0.7, 0.8, 0.65, 'swift'], ['🌿', 0.9, 1.3, 1.3, 'caster']], boss: { ic: '🌳', n: '고대 숲의 수호자', k: 'forest' } },
      { n: '심연의 동굴', ic: '🕳️', rule: '수는 적지만 매우 단단함', cnt: 0.75, hpM: 1.4,
        roster: [['🦇', 0.8, 0.8, 0.75, 'swift'], ['🐛', 1.4, 1, 1.5, 'tank'], ['🪨', 2, 1.1, 1.8, 'tank']], boss: { ic: '🪱', n: '심연의 거대 벌레', k: 'worm' } },
      { n: '잿빛 황무지', ic: '🏜️', rule: '적이 아군을 무작위로 노림', rand: 1,
        roster: [['🧟', 1.1, 1.1, 1.1, 'grunt'], ['🥷', 0.8, 1.3, 0.9, 'swift'], ['🤖', 1.9, 1.3, 1.7, 'tank']], boss: { ic: '💣', n: '황무지 파괴자', k: 'slam' } },
      { n: '잃어버린 유적', ic: '🏛️', rule: '마법 방어: 적이 받는 피해 감소', dr: 0.2,
        roster: [['🗿', 2, 1, 1.8, 'tank'], ['⚔️', 1, 1, 1.1, 'grunt'], ['🧙', 0.8, 1.6, 1.4, 'caster']], boss: { ic: '👑', n: '고대 유적의 지배자', k: 'ruler' } },
      { n: '붉은 지옥', ic: '🌋', rule: '아군이 지속 화염 피해를 받음', burnU: 1,
        roster: [['👺', 1, 1.2, 1.1, 'caster'], ['🐕', 0.8, 1, 0.7, 'swift'], ['🦖', 1.8, 1.2, 1.6, 'tank']], boss: { ic: '😈', n: '지옥의 군주', k: 'rain' } },
      { n: '차원의 균열', ic: '🌌', rule: '적이 공격을 회피함', dodge: 0.15,
        roster: [['👽', 1, 1.1, 1, 'grunt'], ['🌀', 1.2, 1.2, 1.2, 'caster'], ['🛸', 1.6, 1.3, 1.5, 'tank']], boss: { ic: '☄️', n: '차원의 파괴자', k: 'rift' } },
    ];
    const BOSS_SKILL = { forest: '숲의 부름', worm: '재생 굴착', slam: '파쇄 강타', ruler: '고대의 봉인', rain: '화염비', rift: '차원 붕괴' };
    const CLR = (s, d) => !!META.clear[s + '-' + d];
    const stageOpen = s => s === 0 || CLR(s - 1, 0);
    const diffOpen = (s, d) => stageOpen(s) && (d === 0 || CLR(s, d - 1));
    const infOpen = () => CLR(5, 0);
    const themeOf = () => G.stage >= 0 ? STAGES[G.stage] : STAGES[Math.floor((G.wave - 1) / 5) % 6];

    // ========== 로비 = 스테이지 선택 ==========
    let lbDiff = 0;
    function renderLobby() {
      $('lbText').textContent = `최고 기록 Wave ${META.best} · 💎 ${META.ruby}`;

        return `<div class="shop-row"><div class="info">${open ? s.ic : '🔒'} ${i + 1}. ${s.n} ${done ? '✅' : ''}<small>${s.boss.ic} ${s.boss.n} · ${why}</small></div><button class="buy" data-s="${i}" ${open ? '' : 'disabled'}>${done ? '재도전' : '출전'}</button></div>`;
      }).join('') + `<div class="shop-row"><div class="info">${infOpen() ? '♾️' : '🔒'} 무한 모드<small>${infOpen() ? '끝없는 웨이브 · 5웨이브마다 보스' : '캠페인 완료(6스테이지 Easy 클리어) 필요'}</small></div><button class="buy" data-s="-1" ${infOpen() ? '' : 'disabled'}>도전</button></div>`;

    // ========== 웨이브 / 자동 전투 ==========
    function mkEnemy(icon, hp, atk, spd, role='grunt') {
      return { icon, maxHp: hp, hp, atk, spd, cd: spd, role, stun: 0, burn: 0, burnDps: 0 };
    }

    function startWave() {
      if (G.phase !== 'prep') return;
      if (!G.units.length) { battleMsg.textContent = G.bench.length ? '출전 유닛이 없어요. 대기석 유닛을 빈 칸에 배치하세요' : '유닛이 없어요. 슬롯을 돌려 먼저 소환하세요'; return; }
      const w = G.wave, st = themeOf(), df = DIFFS[G.diff], inf = G.stage < 0;
      const sc = inf ? 1 + 0.08 * w : 1 + 0.15 * G.stage;
      const hp = (20 + w * 10) * sc * df.hp * (st.hpM || 1), atk = (2 + w * 1.2) * sc * df.atk;
      const count = Math.min(12, Math.max(2, Math.round((2 + Math.floor(w * 0.8)) * (st.cnt || 1))));
      const avail = Math.min(st.roster.length, 1 + Math.ceil(w / 3));
      const mk = (r, hm = 1, am = 1) => {

        e.dr = (st.dr || 0) * (r[4] === 'tank' ? 1.5 : 1); e.dodge = st.dodge || 0;

      startBtn.disabled = true;

    function bossAct(e, now) {
      const p = e.pow, k = e.boss;

    let lastFieldRender = 0;
    function tick() {
      const dt = 0.1, now = performance.now(), st = themeOf();
      G.units.forEach(u => {
        if (u.regen) u.hp = Math.min(u.maxHp, u.hp + u.maxHp * u.regen * dt);
        if (u.stun > 0) { u.stun -= dt; return; } // 기절: 행동 불가
        u.cd -= dt;
        if (u.cd <= 0 && G.enemies.some(e => e.hp > 0)) {
          // 각 유닛은 독립적인 공격 주기를 유지합니다. 먼저 쓰러질 적을 집중 공격하고,
          // 해당 적이 쓰러지면 같은 틱의 다음 유닛은 살아 있는 다음 적을 공격합니다.
          const living = G.enemies.filter(e => e.hp > 0);
          const target = living.reduce((best, e) => (e.hp / e.maxHp < best.hp / best.maxHp ? e : best), living[0]);
          target.hitAt = now; u.attackAt = now; u.cd = u.spd * u.spdM;
          if (Math.random() < (target.dodge || 0)) pop(0, 'R', '#9aa3c0'); // 회피
          else {
            let dmg = u.atk * (1 - (target.dr || 0)) * ((u.row === 'B' && MELEE.includes(u.name)) ? 0.6 : 1); // 후열 근접 페널티
            if (u.rage) dmg *= 1 + u.rage * (1 - u.hp / u.maxHp);
            if (u.exec && target.hp / target.maxHp < 0.3) dmg *= 1 + u.exec;
            if (u.fs) { dmg *= 2; u.fs = false; }
            const crit = u.crit && Math.random() < u.crit; if (crit) dmg *= 2;
            target.hp -= dmg;
            if (u.steal) u.hp = Math.min(u.maxHp, u.hp + dmg * u.steal);
            if (u.burn) { target.burn = 3; target.burnDps = Math.max(target.burnDps || 0, u.atk * u.burn); }
            pop(dmg, 'R', crit ? '#fbbf24' : '#e8eaf0');
            if (u.cleave && Math.random() < u.cleave) { const o = G.enemies.filter(x => x !== target && x.hp > 0); if (o.length) { const t2 = o[Math.floor(Math.random() * o.length)]; t2.hp -= dmg * 0.5 * (1 - (t2.dr || 0)); t2.hitAt = now; } }
          }
        }
        if (u.sub && G.enemies.length) { u.sk -= dt; if (u.sk <= 0) { u.sk = 4; useSkill(u, now); } }
        if (u.adv && G.enemies.length) { u.ask -= dt; if (u.ask <= 0) { u.ask = ADV[u.name].cd; advSkill(u, now); } }
      });
      G.enemies = G.enemies.filter(e => e.hp > 0);

      G.enemies.forEach(e => {
        if (e.burn > 0) { e.burn -= dt; e.hp -= e.burnDps * dt; } // 상태이상: 화상
        if (e.stun > 0) { e.stun -= dt; return; } // 상태이상: 기절
        if (e.boss) { e.bs -= dt; if (e.bs <= 0) { e.bs = e.bi; bossAct(e, now); } }
        e.cd -= dt;
        if (e.cd <= 0) {
          e.cd = e.spd;
          if (G.units.length) {
            const tg = pickTarget(e, st);
            hurt(tg, e.atk * (tg.name === 'Guard' ? 0.75 : 1), e); pop(e.atk, 'L', '#f87171');
            if (e.splash) G.units.forEach(a => { if (a !== tg) hurt(a, e.atk * e.splash, null); });
          } else G.baseHp -= e.atk;
        }
      });
      if (st.burnU && G.units.length) { const bd = (0.5 + 0.12 * G.wave) * DIFFS[G.diff].atk * dt; G.units.forEach(u => u.hp -= bd); } // 붉은 지옥: 지속 화염
      G.units.forEach(u => { if (u.hp <= 0 && u.leg && u.name === 'Phoenix' && !u.rev) { u.rev = true; u.hp = u.maxHp * 0.5; u.sh = 0; pop(u.maxHp * 0.5, 'L', '#fb923c'); } }); // 불사조 부활
      const before = G.units.length;
      G.units = G.units.filter(u => u.hp > 0);
      if (G.units.length !== before) renderBoard();

      updateHud();
      if (now - lastFieldRender >= 100) { renderField(); lastFieldRender = now; }
      if (G.baseHp <= 0) endGame();
      else if (!G.enemies.length) clearWave();
    }

    function hurt(u, dmg, src) {
      if (u.dodge && Math.random() < Math.min(0.5, u.dodge)) { pop(0, 'L', '#9aa3c0'); return; }
      const raw = dmg;
      if (u.sh > 0) { const a = Math.min(u.sh, dmg); u.sh -= a; dmg -= a; }
      u.hp -= dmg; u.hitAt = performance.now();

    function advSkill(u, now) {
      const alive = G.enemies.filter(e => e.hp > 0); if (!alive.length) return;
      const low = alive.reduce((b, x) => x.hp / x.maxHp < b.hp / b.maxHp ? x : b, alive[0]);
      const hit = (e, m) => { const d = u.atk * m * (1 - (e.dr || 0)); e.hp -= d; e.hitAt = now; pop(d, 'R', '#f0abfc'); return d; };
      if (u.leg) {

      else if (u.name === 'Archer') alive.slice(0, 3).forEach(e => hit(e, 1.2));
      else if (u.name === 'Guard') G.units.forEach(a => a.sh = (a.sh || 0) + a.maxHp * 0.1);

    // 영구 업그레이드: 다음 레벨 비용 = cost × (현재 Lv + 1)
    const UPGRADES = [
      { k: 'gold', name: '시작 골드',  desc: '런 시작 골드 +100', max: 5,  cost: 20 },
      { k: 'spin', name: '시작 스핀',  desc: '런 시작 스핀 +2',   max: 5,  cost: 20 },
      { k: 'atk',  name: '공격 강화',  desc: '유닛 공격력 +5%',   max: 10, cost: 15 },
      { k: 'hp',   name: '체력 강화',  desc: '유닛 체력 +5%',     max: 10, cost: 15 },
      { k: 'slot', name: '보드 확장',  desc: '최대 유닛 +1',      max: 3,  cost: 60 },
    ];
    // 아이템: 구매 즉시 사용. use()가 false면 사용 불가(루비 차감 없음)
    const ITEMS = [
      { id: 'spin',   icon: '🎰', name: '스핀 팩',    desc: '스핀 +5회',          cost: 10, use: () => { G.spins += 5; return true; } },
      { id: 'gold',   icon: '💰', name: '골드 주머니', desc: '골드 +500',          cost: 15, use: () => { G.gold += 500; return true; } },
      { id: 'repair', icon: '🏰', name: '기지 수리',   desc: '기지 HP +50 (최대 100)', cost: 12, fail: '기지 HP가 이미 가득해요',
        use: () => { if (G.baseHp >= 100) return false; G.baseHp = Math.min(100, G.baseHp + 50); return true; } },
      { id: 'summon', icon: '🎫', name: '소환권',      desc: '랜덤 유닛 1기 즉시 소환', cost: 20, fail: '보드가 가득 찼어요',
        use: () => { if (G.units.length >= maxUnits() && G.bench.length >= BENCH_MAX) return false; summonUnit(weightedRandom(true)); return true; } },
    ];

    function loadMeta() {
      try {
        const d = JSON.parse(localStorage.getItem(SAVE_KEY) || localStorage.getItem(LEGACY_SAVE_KEY) || 'null');
        if (d) {
          META.ruby = d.ruby | 0; META.best = d.best | 0; META.clear = d.clear || {};
          if (d.dex) META.dex = { u: d.dex.u || [], t: d.dex.t || [], s: d.dex.s || [], a: d.dex.a || [], l: d.dex.l || [] };
          Object.assign(META.up, d.up || {});
          saveMeta();
        }
      } catch (e) {}
    }
    function saveMeta() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(META)); } catch (e) {} }

    let shopTab = 'items';
    function renderShop() {
      $('rubyShop').textContent = META.ruby;
      $('shopList').innerHTML = shopTab === 'dex' ? dexHtml() : shopTab === 'items'
        ? ITEMS.map(it => `<div class="shop-row"><div class="info">${it.icon} ${it.name}<small>${it.desc}</small></div><button class="buy" data-item="${it.id}" ${META.ruby < it.cost ? 'disabled' : ''}>💎 ${it.cost}</button></div>`).join('')
        : UPGRADES.map(u => {
            const lv = META.up[u.k], maxed = lv >= u.max, cost = u.cost * (lv + 1);
            return `<div class="shop-row"><div class="info">${u.name}<small>${u.desc} · Lv ${lv}/${u.max}</small></div><button class="buy" data-up="${u.k}" ${maxed || META.ruby < cost ? 'disabled' : ''}>${maxed ? 'MAX' : '💎 ' + cost}</button></div>`;
          }).join('');
    }

    $('shopList').addEventListener('click', e => {
      const b = e.target.closest('.buy');
      if (!b || b.disabled) return;
      const msg = $('shopMsg');
      if (b.dataset.item) {
        const it = ITEMS.find(x => x.id === b.dataset.item);
        if (G.phase === 'over') { msg.textContent = '게임 오버 상태예요. 다시 시작한 뒤 사용하세요'; return; }
        if (!it.use()) { msg.textContent = it.fail; return; }
        META.ruby -= it.cost;
        msg.textContent = `${it.name} 사용!`;
      } else {
        const u = UPGRADES.find(x => x.k === b.dataset.up);
        META.ruby -= u.cost * (META.up[u.k] + 1);
        META.up[u.k] += 1;
        G.units.forEach(x => { const r = x.hp / x.maxHp; applyStats(x); x.hp = x.maxHp * r; });
        msg.textContent = `${u.name} Lv ${META.up[u.k]}!`;
      }
      saveMeta(); updateHud(); renderShop(); renderField();
    });

    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      shopTab = t.dataset.tab;
      document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
      $('shopMsg').textContent = '';
      renderShop();
    }));
    function closeShop() {
      $('shopPanel').classList.remove('open');
      overlay.classList.remove('show');
      mainArea.classList.remove('dimmed');
    }
    $('shopBtn').addEventListener('click', () => {
      $('shopMsg').textContent = '';
      renderShop();
      $('shopPanel').classList.add('open');
      overlay.classList.add('show');
      mainArea.classList.add('dimmed');
    });
    $('shopClose').addEventListener('click', closeShop);
    overlay.addEventListener('click', closeShop);
    loadMeta();
    renderLobby();

    startBtn.addEventListener('click', () => G.phase === 'over' ? resetGame() : startWave());
    resetGame();
  </script>
</body>
</html>
