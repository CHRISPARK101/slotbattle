<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>SLOT BATTLE V3 - Improved Feedback</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1220;
      color: #e8eaf0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .phone {
      width: 375px;
      height: 720px;
      background: #15192b;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      border: 2px solid #2a2f45;
    }

    .top-bar {
      height: 52px;
      background: #1c2135;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid #2a2f45;
      z-index: 10;
      position: relative;
    }

    .wave-strip { display:flex; align-items:center; gap:6px; }
    .wave-strip i { font-style:normal; }
    .ws-cur { background:#30275b; border:1px solid #8b75ff; border-radius:8px; padding:2px 8px; font-weight:800; color:#fff; white-space:nowrap; }
    .ws-cur.boss { background:#4a1d24; border-color:#f87171; }
    .ws-cur small { font-weight:500; color:#9aa3c0; font-size:10px; }
    .ws-next { color:#7a84a5; font-size:11px; }
    .ws-boss { color:#fca5a5; font-size:11px; white-space:nowrap; }
    .top-bar span {
      background: #252b42;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .main-area {
      height: calc(100% - 52px - 64px);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: filter 0.35s ease;
    }

    .main-area.dimmed {
      filter: brightness(0.5);
    }

    .battle-zone {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1a1f35 0%, #12162a 100%);
    }

    .battle-placeholder {
      text-align: center;
      opacity: 0.65;
    }

    .battle-placeholder .icon { font-size: 42px; margin-bottom: 8px; }
    .battle-placeholder p { font-size: 14px; color: #9aa3c0; }

    .unit-board {
      height: 90px;
      background: #1a1f33;
      border-top: 1px solid #2a2f45;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      align-items: center;
    }

    .unit-board-label {
      font-size: 11px;
      color: #7a84a5;
      writing-mode: vertical-rl;
      margin-right: 4px;
      letter-spacing: 1px;
    }

    .unit-card {
      min-width: 62px;
      height: 70px;
      background: #252b42;
      border-radius: 10px;
      border: 1px solid #323a58;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      position: relative;
      animation: unitIn 0.35s ease;
    }

    .unit-card .name {
      font-size: 10px;
      color: #9aa3c0;
      margin-top: 2px;
    }

    .unit-card.new {
      border-color: #7b5cff;
      box-shadow: 0 0 10px rgba(123,92,255,0.45);
    }

    @keyframes unitIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .bottom-bar {
      height: 64px;
      background: #1c2135;
      border-top: 1px solid #2a2f45;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      position: relative;
    }

    .open-slot-btn {
      background: linear-gradient(135deg, #5b6cff, #7b5cff);
      color: white;
      border: none;
      padding: 12px 40px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(91,108,255,0.35);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 25;
    }
    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .slot-panel {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 68%;
      background: #1a1f35;
      border-radius: 22px 22px 0 0;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 30;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 36px rgba(0,0,0,0.5);
    }
    .slot-panel.open { transform: translateY(0); }

    .panel-handle {
      width: 36px; height: 4px;
      background: #3a415c;
      border-radius: 4px;
      margin: 10px auto 4px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 18px 10px;
      font-size: 13px;
      color: #9aa3c0;
    }

    .close-btn {
      background: #2a2f45;
      border: none;
      color: #c5cbe0;
      width: 30px; height: 30px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
    }

    .slot-body {
      display: flex;
      padding: 0 12px 0 16px;
      gap: 12px;
      flex: 1;
    }

    .slot-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      align-content: start;
    }

    .slot-cell {
      aspect-ratio: 1;
      background: #252b42;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      border: 2px solid #323a58;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .slot-cell.spinning {
      animation: cellSpin 0.45s ease;
    }

    .slot-cell.matched {
      border-color: #a78bfa;
      box-shadow: 0 0 18px rgba(167,139,250,0.75), 0 0 40px rgba(167,139,250,0.35);
      transform: scale(1.08);
      background: linear-gradient(145deg, #4c3d7a, #2a2548);
      animation: matchPulse 0.6s ease;
    }

    @keyframes cellSpin {
      0% { transform: scale(1); }
      35% { transform: scale(0.78) rotate(-10deg); }
      100% { transform: scale(1); }
    }

    @keyframes matchPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.15); }
      100% { transform: scale(1.08); }
    }

    .slot-cell.line-glow {
      box-shadow: 0 0 22px rgba(251,191,36,0.8);
      border-color: #fbbf24;
    }

    .phone.shake {
      animation: phoneShake 0.45s ease;
    }
    @keyframes phoneShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px) rotate(-0.5deg); }
      40% { transform: translateX(6px) rotate(0.5deg); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* 사이드 슬라이드 바 - 위에서 아래로 */
    .slide-bar-wrap {
      width: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .slide-label {
      font-size: 11px;
      color: #7a84a5;
      writing-mode: vertical-rl;
      letter-spacing: 2px;
    }

    .slide-track {
      width: 36px;
      height: 180px;
      background: #12162a;
      border-radius: 20px;
      border: 2px solid #2a2f45;
      position: relative;
      overflow: hidden;
    }

    .slide-fill {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 0%;
      background: linear-gradient(180deg, #5b6cff, #7b5cff);
      border-radius: 16px 16px 0 0;
      transition: height 0.05s linear;
    }

    .slide-thumb {
      position: absolute;
      left: 3px; right: 3px;
      height: 42px;
      background: #e8eaf0;
      border-radius: 14px;
      top: 4px;          /* 기본 위치: 위쪽 */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #1a1f35;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      cursor: grab;
      touch-action: none;
      transition: top 0.05s linear;
    }

    .slide-thumb:active { cursor: grabbing; }

    .slide-hint {
      font-size: 10px;
      color: #5a6480;
      text-align: center;
      line-height: 1.3;
    }

    .result-area {
      padding: 10px 16px 16px;
      min-height: 70px;
    }

    .spin-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #9aa3c0;
      margin-bottom: 8px;
    }

    .spin-info strong { color: #e8eaf0; }

    .summon-log {
      font-size: 13px;
      color: #c4b5fd;
      min-height: 20px;
      text-align: center;
    }

    .summon-log.success {
      animation: logPop 0.4s ease;
    }

    @keyframes logPop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .bottom-bar { gap: 10px; }
    .open-slot-btn { padding: 12px 26px; }
    .start-btn {
      background: #2a2f45; color: #e8eaf0; border: 1px solid #3a415c;
      padding: 12px 22px; border-radius: 24px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .start-btn:disabled { opacity: 0.45; cursor: default; }
    .battle-zone { position: relative; flex-direction: column; }
    .field { flex: 1; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; }
    .side { width: 46%; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-content: center; }
    .actor { width: 44px; text-align: center; }
    .actor .ico { font-size: 26px; transition: transform 0.1s; }
    .hp { height: 4px; background: #12162a; border-radius: 2px; overflow: hidden; margin-bottom: 2px; }
    .hp i { display: block; height: 100%; background: #4ade80; }
    .foe .hp i { background: #f87171; }
    .ally.hit .ico { transform: translateX(-5px); filter: brightness(2); }
    .foe.hit .ico { transform: translateX(5px); filter: brightness(2); animation: foeImpact .24s ease; }
    .ally.attack .ico { animation: allyStrike .28s ease-in-out; filter: brightness(1.35) drop-shadow(0 0 7px rgba(96,165,250,.9)); }
    @keyframes allyStrike { 0% { transform:translateX(0) scale(1); } 45% { transform:translateX(13px) scale(1.18); } 100% { transform:translateX(0) scale(1); } }
    @keyframes foeImpact { 0%,100% { transform:translateX(0); } 30% { transform:translateX(5px) scale(1.12); } 65% { transform:translateX(-4px); } }
    .battle-msg { font-size: 12px; color: #9aa3c0; text-align: center; padding: 8px 14px 12px; min-height: 40px; }
    .unit-card { animation: none; }
    .unit-card.new { animation: unitIn 0.35s ease; }

    .slot-cell { cursor: pointer; }
    .slot-cell.rolling { filter: blur(1.5px); border-color: #5b6cff; }
    .unit-card { cursor: pointer; }
    .unit-card.sel { border-color: #fbbf24; box-shadow: 0 0 10px rgba(251,191,36,0.5); }
    .unit-card .lv { font-size: 9px; color: #fbbf24; min-height: 11px; }

    .top-bar { padding: 0 8px; font-size: 12px; }
    .top-bar span { padding: 4px 8px; }
    .top-bar span span { padding: 0; background: none; border-radius: 0; }
    .shop-btn { width: 46px; height: 46px; border-radius: 50%; border: 1px solid #3a415c; background: #252b42; font-size: 20px; cursor: pointer; }
    .shop-tabs { display: flex; gap: 8px; padding: 0 16px 8px; }
    .tab { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid #323a58; background: #252b42; color: #9aa3c0; font-weight: 700; font-size: 13px; cursor: pointer; }
    .tab.on { background: #5b6cff; color: #fff; border-color: #5b6cff; }
    .shop-msg { font-size: 12px; color: #c4b5fd; text-align: center; min-height: 18px; padding: 0 16px 6px; }
    .shop-list { flex: 1; overflow-y: auto; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 8px; }
    .shop-row { display: flex; align-items: center; gap: 10px; background: #252b42; border: 1px solid #323a58; border-radius: 12px; padding: 10px 12px; }
    .shop-row .info { flex: 1; font-size: 13px; }
    .shop-row .info small { display: block; color: #7a84a5; font-size: 11px; margin-top: 2px; }
    .buy { background: #7b5cff; color: #fff; border: none; border-radius: 16px; padding: 8px 12px; font-weight: 700; font-size: 13px; cursor: pointer; min-width: 68px; }
    .buy:disabled { opacity: 0.4; cursor: default; }
    .inf { position: absolute; top: -2px; right: -2px; padding: 4px 6px; font-size: 10px; font-style: normal; color: #7a84a5; }
    .lk { position: absolute; top: 2px; left: 4px; font-size: 9px; font-style: normal; }
    .result-screen { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,0.72); display: none; align-items: center; justify-content: center; }
    .result-screen.show { display: flex; }
    .rs-card { background: #1a1f35; border: 1px solid #3a415c; border-radius: 18px; padding: 24px 28px; text-align: center; }
    .rs-card h2 { margin-bottom: 10px; } .rs-card p { color: #9aa3c0; font-size: 13px; margin-bottom: 16px; line-height: 1.6; }
    .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .pop { position: absolute; font-weight: 800; font-size: 14px; animation: popUp 0.7s ease-out forwards; text-shadow: 0 1px 3px #000; }
    @keyframes popUp { to { transform: translateY(-30px); opacity: 0; } }
    .tab { font-size: 12px; padding: 8px 4px; }
    .rs-card .shop-list { min-width: 250px; }

    /* ===== V2 MOBILE REBUILD ===== */
    :root { color-scheme: dark; }
    html, body { width:100%; height:100%; min-height:100%; }
    body {
      min-height:100dvh; height:100dvh; padding:0;
      background: radial-gradient(ellipse at 50% 0%, #202b4d 0%, #0b1020 62%);
      overscroll-behavior:none;
    }
    .phone {
      width:min(100vw, 480px);
      height:100dvh; max-height:100dvh;
      border:0; border-radius:0;
      display:flex; flex-direction:column;
      box-shadow:none;
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
    }
    .top-bar { flex:0 0 48px; height:48px; gap:4px; padding:0 7px; font-size:clamp(10px,2.8vw,12px); }
    .top-bar > span { padding:5px 6px; white-space:nowrap; }
    .main-area { height:auto; flex:1; min-height:0; }
    .battle-zone { min-height:0; overflow:hidden; }
    .field {
      min-height:0;
      padding:8px 7px;
      gap:6px;
      display:grid;
      grid-template-columns:minmax(0, 1.75fr) minmax(88px, 1fr);
      align-items:stretch;
    }
    .field .ally-side {
      position:relative;
      width:auto;
      min-width:0;
      min-height:100%;
      height:100%;
      padding:22px 4px 8px;
      border:1px dashed rgba(91,108,255,.28);
      border-radius:12px;
      background:linear-gradient(135deg,rgba(91,108,255,.075),rgba(30,41,75,.12));
      overflow:hidden;
    }
    .field .enemy-side {
      position:relative;
      width:auto;
      min-width:0;
      min-height:100%;
      height:100%;
      display:flex;
      flex-wrap:wrap;
      gap:clamp(3px,1vw,7px);
      justify-content:center;
      align-content:center;
      align-items:center;
      padding:8px 2px;
      border-left:1px solid rgba(248,113,113,.16);
    }
    .actor { width:clamp(36px,10vw,52px); }
    .actor .ico { font-size:clamp(23px,7vw,34px); line-height:1.2; }
    .hp { height:5px; }
    .battle-msg { min-height:38px; max-height:52px; overflow:auto; padding:7px 10px; }
    .unit-board { flex:0 0 88px; height:88px; min-height:88px; padding:7px 9px; gap:7px; }
    .unit-card { min-width:58px; height:70px; }
    .bottom-bar { flex:0 0 64px; height:64px; gap:7px; padding:0 8px; }
    .open-slot-btn { flex:1; min-width:0; padding:12px 8px; font-size:14px; }
    .start-btn { padding:11px 10px; font-size:13px; white-space:nowrap; }
    .shop-btn { flex:0 0 44px; width:44px; height:44px; }
    .slot-panel { height:min(78%, 690px); height:min(78dvh, 690px); padding-bottom:env(safe-area-inset-bottom); }
    .shop-panel { height:min(76dvh, 650px); }
    .slot-body { min-height:0; align-items:center; gap:10px; padding:0 12px; }
    .slot-grid { max-width:min(70vw, 330px); gap:clamp(5px,1.6vw,9px); }
    .slot-cell { min-width:0; font-size:clamp(23px,7vw,34px); border-radius:clamp(8px,2.5vw,13px); }
    .slide-bar-wrap { flex:0 0 44px; width:44px; }
    .slide-track { height:min(31vh, 210px); height:min(31dvh, 210px); width:34px; }
    .result-area { padding:8px 12px calc(12px + env(safe-area-inset-bottom)); }
    .rs-card { width:min(90%, 360px); max-height:85%; overflow:auto; padding:22px 18px; }
    .shop-list { overscroll-behavior:contain; }
    button { touch-action:manipulation; }
    .actor.hit .ico { animation: hitFlash .16s ease; }
    @keyframes hitFlash { 50% { transform:scale(1.2); filter:brightness(2.2); } }
    .actor.foe .ico { filter:drop-shadow(0 2px 5px rgba(248,113,113,.25)); }
    .actor.swift .ico { filter:drop-shadow(0 0 6px rgba(96,165,250,.8)); }
    .actor.tank .ico { filter:drop-shadow(0 0 7px rgba(251,191,36,.7)); transform:scale(1.08); }
    .actor.caster .ico { filter:drop-shadow(0 0 7px rgba(192,132,252,.8)); }
    .actor.boss .ico { font-size:clamp(31px,9vw,42px); filter:drop-shadow(0 0 9px rgba(248,113,113,.9)); }
    .actor.ally .ico { filter:drop-shadow(0 2px 5px rgba(74,222,128,.18)); }
    .slot-cell.matched { background:linear-gradient(145deg,#3b3265,#252b42); }
    .slot-panel, .shop-panel { overscroll-behavior:contain; }
    .board-tools { writing-mode:horizontal-tb; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-width:52px; margin:0; letter-spacing:0; }
    .absorb-toggle { border:1px solid #6d5ce7; background:#29234b; color:#d9d2ff; border-radius:8px; padding:5px 6px; font-size:9px; font-weight:800; white-space:nowrap; transition: all 0.2s; }
    .absorb-toggle.on { background:#6d5ce7; color:#fff; box-shadow:0 0 12px #6d5ce7aa; transform: scale(1.05); }
    .absorb-toggle:not(.on) { animation: absorbHint 2s ease-in-out infinite; }
    @keyframes absorbHint { 0%,100%{ box-shadow:0 0 0 transparent; } 50%{ box-shadow:0 0 8px #6d5ce766; } }
    .unit-card { touch-action:pan-y; }
    .unit-card.drag-source { opacity:.55; transform:scale(.94); }
    .unit-card.drop-target { border-color:#4ade80; box-shadow:0 0 12px #4ade8088; }
    .unit-board.absorb-mode .unit-card:not(.locked) { border-color:#7668cb; }
    .unit-board.absorb-mode .unit-card { touch-action:none; }
    .unit-card.locked { opacity:.72; }
    .absorb-hint { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(100% + 4px); font-size:10px; color:#c4b5fd; white-space:nowrap; pointer-events:none; }
    #absorbChoice { z-index:60; }
    #absorbChoice .rs-card { text-align:left; }
    #absorbChoice .rs-card h2, #absorbChoice .rs-card p { text-align:center; }
    .trait-choice-list { display:flex; flex-direction:column; gap:8px; width:100%; }
    .trait-choice { width:100%; border:1px solid #465078; border-radius:10px; padding:11px 12px; background:#252b42; color:#e8eaf0; text-align:left; font-size:13px; }
    .trait-choice small { display:block; color:#9aa3c0; margin-top:3px; }
    .trait-choice.convert { border-color:#8b75ff; background:#30275b; }
    .trait-choice.cancel { border-color:#596078; background:#20263a; text-align:center; }
    @media (min-width:600px) {
      .phone { width:min(100vw,480px); border-left:1px solid #303958; border-right:1px solid #303958; }
    }
    @media (max-height:650px) {
      .top-bar { flex-basis:42px; height:42px; }
      .unit-board { flex-basis:76px; height:76px; min-height:76px; }
      .bottom-bar { flex-basis:58px; height:58px; }
      .slide-track { height: min(25dvh,150px); }
      .slot-panel { height:84dvh; }
    }

  
    .dtab{flex:1;padding:8px 4px;border-radius:10px;border:1px solid #323a58;background:#252b42;color:#9aa3c0;font-weight:700;font-size:12px;cursor:pointer}
    .dtab.on{background:#5b6cff;color:#fff;border-color:#5b6cff}
    .lb-diff{display:flex;gap:6px;margin-bottom:10px}
    #lobby .rs-card{text-align:left} #lobby .rs-card h2,#lobby .rs-card p{text-align:center}
    .actor.elite .ico{filter:drop-shadow(0 0 6px #fbbf24)}
  
    .unit-card.empty{background:transparent;border:1px dashed #3a415c;color:#4b5578;font-size:18px}
    .unit-card.bench{border-style:dashed;touch-action:none}

    .unit-card.adv{border-color:#fbbf24;box-shadow:0 0 10px rgba(251,191,36,.45);background:linear-gradient(#34301f,#252b42)}
    .unit-card .vr{font-size:8px;color:#4ade80;margin-left:2px}.unit-card .vr.dn{color:#f87171}
    .actor.advfx .ico{filter:drop-shadow(0 0 7px #fbbf24)}

    @keyframes absorbPulse { 50% { filter:brightness(1.25); transform:scale(1.03); } }

    .actor.ally.dragging { opacity: 0.4; transform: scale(0.88); }

    .ally-side { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; padding: 8px 4px; }
    .actor.bench-actor { opacity:.8; outline:1px dashed #a78bfa; outline-offset:-2px; border-radius:10px; background:rgba(167,139,250,.12); padding:2px 4px 0; min-width:40px; }
    .ally-tag { font-size:9px; line-height:1.15; color:#e8eaf0; white-space:nowrap; text-shadow:0 1px 2px #000; pointer-events:none; }
    .ally-tag.adv { color:#fde68a; } .ally-tag.leg { color:#e9d5ff; }

    .slot.new { border-color:#34d399; border-style:dashed; color:#34d399; background:rgba(52,211,153,.08); }

    .field-pos-label { position: absolute; top: 4px; left: 8px; font-size: 10px; color: #5a6480; pointer-events: none; }
    .drag-ghost {
      position: fixed; z-index: 80; pointer-events: none; font-size: 32px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5)); opacity: 0.9;
      transform: translate(-50%, -50%) scale(1.15);
    }
    .jp-fx{position:absolute;inset:0;z-index:55;pointer-events:none;display:none;align-items:center;justify-content:center;font-weight:900;font-size:clamp(28px,8vw,42px);color:#fff;text-shadow:0 0 22px #fbbf24, 0 0 40px #f59e0b;text-align:center;line-height:1.25;letter-spacing:1px}
    .jp-fx.show{display:flex;animation:jpFlash 1.8s ease-out forwards}
    .jp-fx.prism span{background:linear-gradient(90deg,#f87171,#fbbf24,#4ade80,#60a5fa,#c084fc,#f87171);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px #c084fc);animation:prismShift 1.2s linear infinite}
    @keyframes prismShift { to { background-position: 200% center; } }
    @keyframes jpFlash{0%{background:rgba(255,255,255,.95);transform:scale(.5);opacity:1}25%{background:rgba(251,191,36,.4);transform:scale(1.18)}55%{background:rgba(167,139,250,.25);transform:scale(1.05)}100%{background:transparent;transform:scale(1);opacity:0}}
    .skill-pop {
      position: absolute; left: 50%; top: 28%; transform: translateX(-50%);
      font-weight: 800; font-size: 15px; color: #f0abfc;
      text-shadow: 0 0 12px #c084fc, 0 1px 3px #000;
      animation: skillPop 1.1s ease-out forwards; pointer-events: none; z-index: 50;
      white-space: nowrap;
    }
    @keyframes skillPop {
      0% { opacity: 0; transform: translateX(-50%) translateY(12px) scale(0.8); }
      20% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.1); }
      70% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-18px) scale(1); }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="top-bar">
      <span>💰 <span id="gold">900</span></span>
      <span>🔷 <span id="essence">0</span></span>
      <span class="wave-strip"><span id="wave">W1</span></span>
      <span>🏰 <span id="baseHp">100</span></span>
      <span><span id="unitCount">0</span>/<span id="maxUnits">5</span></span>
      <span>💎 <span id="ruby">0</span></span>
    </div>

    <div class="main-area" id="mainArea">
      <div class="battle-zone">
        <div class="field" id="field"></div>
        <div class="battle-msg" id="battleMsg"></div>
        <div class="fx" id="fx"></div>
      </div>

      <div class="unit-board" id="unitBoard">
        <div class="unit-board-label">BOARD</div>
      </div>
    </div>

    <div class="bottom-bar">
      <button class="open-slot-btn" id="openBtn">슬롯 열기</button>
      <button class="start-btn" id="startBtn">▶ 웨이브 시작</button>
      <button class="shop-btn" id="shopBtn">🛒</button>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="slot-panel shop-panel" id="shopPanel">
      <div class="panel-handle"></div>
      <div class="panel-header"><span>SHOP · 🔷 <b id="essShop">0</b> · 💎 <b id="rubyShop">0</b></span><button class="close-btn" id="shopClose">✕</button></div>
      <div class="shop-tabs">
        <button class="tab on" data-tab="items">아이템</button>
        <button class="tab" data-tab="upg">업그레이드</button>
        <button class="tab" data-tab="dex">도감</button>
      </div>
      <div class="shop-msg" id="shopMsg"></div>
      <div class="shop-list" id="shopList"></div>
    </div>

    <div class="slot-panel shop-panel" id="detailPanel">
      <div class="panel-handle"></div>
      <div class="panel-header"><span>UNIT DETAIL</span><button class="close-btn" id="detailClose">✕</button></div>
      <div class="shop-msg" id="detailMsg"></div>
      <div class="shop-list" id="detailBody"></div>
    </div>

    <div class="result-screen" id="absorbChoice">
      <div class="rs-card">
        <h2 id="absorbChoiceTitle">✨ 특성 계승</h2>
        <p id="absorbChoiceText">희생 유닛의 특성을 선택하세요.</p>
        <div class="trait-choice-list" id="absorbChoiceList"></div>
      </div>
    </div>

    <div class="result-screen" id="resultScreen">
      <div class="rs-card"><h2 id="rsTitle">GAME OVER</h2><p id="rsText"></p><button class="start-btn" id="rsNext" style="display:none">다음 스테이지</button> <button class="start-btn" id="rsBtn">다시 시작</button> <button class="start-btn" id="rsLobby">로비</button></div>
    </div>

    <div class="result-screen" id="coreScreen">
      <div class="rs-card"><h2>Core 선택</h2><p>이번 판의 규칙을 바꿔요</p><div id="coreList" class="shop-list"></div></div>
    </div>

    <div class="result-screen show" id="lobby">
      <div class="rs-card"><h2>🎰 SLOT BATTLE</h2><p id="lbText"></p><div class="lb-diff" id="lbDiff"></div><div class="shop-list" id="lbStages"></div></div>
    </div>

    <div class="jp-fx" id="jpFx"></div>

    <div class="slot-panel" id="slotPanel">
      <div class="panel-handle"></div>
      <div class="panel-header">
        <span>SLOT MACHINE</span>
        <button class="close-btn" id="closeBtn">✕</button>
      </div>

      <div class="slot-body">
        <div class="slot-grid" id="slotGrid">
          <div class="slot-cell" data-idx="0">🗡️</div>
          <div class="slot-cell" data-idx="1">🏹</div>
          <div class="slot-cell" data-idx="2">🔮</div>
          <div class="slot-cell" data-idx="3">🗡️</div>
          <div class="slot-cell" data-idx="4">🛡️</div>
          <div class="slot-cell" data-idx="5">🏹</div>
          <div class="slot-cell" data-idx="6">🔮</div>
          <div class="slot-cell" data-idx="7">🗡️</div>
          <div class="slot-cell" data-idx="8">🏹</div>
        </div>

        <!-- 사이드 슬라이드 바 : 위에서 아래로 -->
        <div class="slide-bar-wrap">
          <div class="slide-label">PULL</div>
          <div class="slide-track" id="slideTrack">
            <div class="slide-fill" id="slideFill"></div>
            <div class="slide-thumb" id="slideThumb">↓</div>
          </div>
          <div class="slide-hint">아래로<br>내리세요</div>
        </div>
      </div>

      <div class="result-area">
        <div class="spin-info">
          <div>비용 <strong id="costEl">100</strong></div>
          <div>남은 횟수 <strong id="remainSpin">5</strong></div>
        </div>
        <div class="summon-log" id="summonLog">슬라이드 바를 아래로 내려 스핀하세요</div>
      </div>
    </div>
  </div>

  <script>
    const BENCH_MAX = 3, MELEE = ['Warrior', 'Guard', 'Cavalry']; // 자유 배치 (Slotbound: 줄 구분 없음, 배열 순서가 앞→뒤)
    const SPIN_COST = 100, NUDGE_COST = 40, MAX_UNITS = 5, MAX_LV = 60;

    // 심볼 = 유닛 원형 데이터 (hp / atk / spd = 공격 간격(초))
    const SYMBOLS = [
      { icon: '🗡️', name: 'Warrior', weight: 22, hp: 60,  atk: 8,  spd: 1.0 },
      { icon: '🏹', name: 'Archer',  weight: 22, hp: 35,  atk: 10, spd: 0.8 },
      { icon: '🛡️', name: 'Guard',   weight: 18, hp: 100, atk: 4,  spd: 1.2 },
      { icon: '🔮', name: 'Mage',    weight: 16, hp: 30,  atk: 14, spd: 1.5 },
      { icon: '🐴', name: 'Cavalry', need: 3, weight: 12, hp: 70,  atk: 12, spd: 1.0 },
      { icon: '⭐', name: 'Special', need: 6, weight: 10, hp: 50,  atk: 16, spd: 1.0 },
      { icon: '🌈', name: 'Prism',   need: 3, weight: 3,  prism: true, hp: 0, atk: 0, spd: 1 }, // 와일드: 줄을 완성하면 전설 유닛
    ];

    const PAYLINES = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    // 게임 상태는 한 객체로 관리 (phase: prep / fight / over)
    const G = { stage: 0, diff: 0, gold: 0, spins: 0, wave: 1, baseHp: 100, phase: 'prep', spinning: false, units: [], bench: [], enemies: [] };

    const openBtn = document.getElementById('openBtn');
    const closeBtn = document.getElementById('closeBtn');
    const slotPanel = document.getElementById('slotPanel');
    const overlay = document.getElementById('overlay');
    const mainArea = document.getElementById('mainArea');
    const cells = document.querySelectorAll('.slot-cell');
    const unitBoard = document.getElementById('unitBoard');
    const summonLog = document.getElementById('summonLog');
    const goldEl = document.getElementById('gold');
    const unitCountEl = document.getElementById('unitCount');
    const remainSpinEl = document.getElementById('remainSpin');

    const slideTrack = document.getElementById('slideTrack');
    const slideThumb = document.getElementById('slideThumb');
    const slideFill = document.getElementById('slideFill');

    function openPanel() {
      slotPanel.classList.add('open');
      overlay.classList.add('show');
      mainArea.classList.add('dimmed');
    }
    function closePanel() {
      slotPanel.classList.remove('open');
      overlay.classList.remove('show');
      mainArea.classList.remove('dimmed');
      resetSlide();
    }

    openBtn.addEventListener('click', openPanel);
    closeBtn.addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);

    // ========== 슬라이드 바 (위에서 아래로) ==========
    let dragging = false;
    let startY = 0;
    let currentPull = 0; // 0(위) ~ 1(아래)

    const TRACK_HEIGHT = 180;
    const THUMB_HEIGHT = 42;
    const MAX_TRAVEL = TRACK_HEIGHT - THUMB_HEIGHT - 8;

    function setPull(ratio) {
      ratio = Math.max(0, Math.min(1, ratio));
      currentPull = ratio;
      const top = 4 + ratio * MAX_TRAVEL;
      slideThumb.style.top = top + 'px';
      slideFill.style.height = (ratio * 100) + '%';
    }

    function resetSlide() {
      setPull(0);
      slideThumb.textContent = '↓';
    }

    function onStart(clientY) {
      if (G.spinning) return;
      dragging = true;
      startY = clientY;
      slideThumb.style.transition = 'none';
      slideFill.style.transition = 'none';
    }

    function onMove(clientY) {
      if (!dragging) return;
      const delta = clientY - startY; // 아래로 내리면 양수
      const ratio = delta / MAX_TRAVEL;
      setPull(ratio);
    }

    function onEnd() {
      if (!dragging) return;
      dragging = false;
      slideThumb.style.transition = 'top 0.2s ease';
      slideFill.style.transition = 'height 0.2s ease';

      if (currentPull >= 0.85 && doSpin()) {
        slideThumb.textContent = '✓';
      } else {
        resetSlide();
      }
    }

    // 마우스
    slideThumb.addEventListener('mousedown', e => {
      e.preventDefault();
      onStart(e.clientY);
    });
    window.addEventListener('mousemove', e => onMove(e.clientY));
    window.addEventListener('mouseup', onEnd);

    // 터치
    slideThumb.addEventListener('touchstart', e => {
      e.preventDefault();
      onStart(e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if (dragging) {
        e.preventDefault();
        onMove(e.touches[0].clientY);
      }
    }, { passive: false });

    window.addEventListener('touchend', onEnd);

    // ========== 유틸 / HUD ==========
    const $ = id => document.getElementById(id);
    const field = $('field'), battleMsg = $('battleMsg'), startBtn = $('startBtn');
    let timer = null;

    function say(t, ok) {
      summonLog.textContent = t;
      summonLog.classList.remove('success');
      if (ok) { void summonLog.offsetWidth; summonLog.classList.add('success'); }
    }
    function updateHud() {
      goldEl.textContent = G.gold;
      $('essence').textContent = G.essence | 0;
      remainSpinEl.textContent = G.spins;
      unitCountEl.textContent = G.units.length + (G.bench.length ? '+' + G.bench.length : '');
      { // 웨이브 표시: 현재 웨이브 / 다음 웨이브 / 가장 가까운 보스 웨이브
        const inf = G.stage < 0, mx = inf ? Infinity : waveMax(), w = G.wave;
        const isBoss = x => x % 5 === 0 || x === mx;
        let nb = w; while (nb <= (inf ? w + 5 : mx) && !isBoss(nb)) nb++;
        $('wave').innerHTML = `<i class="ws-cur${isBoss(w) ? ' boss' : ''}">${isBoss(w) ? '👹' : ''}W${w}<small>${inf ? ' ♾️' : '/' + mx}</small></i>` +
          (w < mx ? `<i class="ws-next">${w + 1}</i>` : '') +
          (nb > w && nb <= mx ? `<i class="ws-boss">👹${nb}</i>` : '');
      }
      $('baseHp').textContent = Math.max(0, Math.ceil(G.baseHp));
      $('ruby').textContent = META.ruby;
      $('costEl').textContent = spinCost();
      $('maxUnits').textContent = maxUnits();
    }

    // ========== 스핀 + 판정 + 소환 ==========
    function weightedRandom(noPrism) {
      const pool = SYMBOLS.filter(x => META.best >= (x.need || 0) && !(noPrism && x.prism)); // 최고 웨이브로 해금
      const w = x => x.weight * (G.core === 'lucky' && x.name === 'Special' ? 2 : 1);
      let r = Math.random() * pool.reduce((a, x) => a + w(x), 0);
      for (const x of pool) { r -= w(x); if (r <= 0) return x; }
      return pool[0];
    }

    function drawGrid() { cells.forEach((c, i) => c.textContent = G.grid[i].icon); }

    // 현재 그리드의 매칭 판정 + 소환. 매칭된 줄 수를 반환
    function jackpotFx(text, prism) {
      const el = $('jpFx'); el.className = 'jp-fx' + (prism ? ' prism' : '');
      el.innerHTML = `<span>${text}</span>`; void el.offsetWidth; el.classList.add('show');
      // stronger vibration + screen shake
      try { navigator.vibrate && navigator.vibrate(prism ? [100, 40, 100, 40, 180] : [80, 30, 120]); } catch (e) {}
      const phone = document.querySelector('.phone');
      if (phone) { phone.classList.remove('shake'); void phone.offsetWidth; phone.classList.add('shake'); setTimeout(() => phone.classList.remove('shake'), 500); }
      clearTimeout(jackpotFx.t); jackpotFx.t = setTimeout(() => el.classList.remove('show'), 1800);
    }
    function evalGrid() {
      const g = G.grid, lines = [], idx = new Set();
      PAYLINES.forEach(([a, b, c]) => {
        const real = [g[a], g[b], g[c]].filter(x => !x.prism); // Prism = 와일드
        if (real.length && !real.every(x => x.name === real[0].name)) return;
        lines.push(real.length === 3 ? { sym: real[0] } : { prism: true });
        [a, b, c].forEach(i => idx.add(i));
      });
      cells.forEach((c, i) => {
        c.classList.toggle('matched', idx.has(i));
        c.classList.toggle('line-glow', idx.has(i) && lines.length >= 2);
      });
      if (!lines.length) return 0;
      const jackpot = lines.length >= 2;
      let n = 0, legends = 0, forceAdv = jackpot;
      lines.forEach(l => {
        if (l.prism) { if (summonLegend()) { n++; legends++; } }
        else if (summonUnit(l.sym, forceAdv ? { adv: true } : undefined)) { n++; forceAdv = false; }
      });
      if (lines.length >= 3) G.spins += 2;
      if (jackpot) G.essence += lines.length >= 3 ? 4 : 2; // 슬롯 다중 당첨/잭팟 → 정수
      if (legends) jackpotFx('🌈 PRISM!<br>전설 유닛 소환!', true);
      else if (jackpot) jackpotFx(lines.length >= 3 ? '🎰 MEGA JACKPOT!' : '🎰 JACKPOT!', false);
      else if (lines.length === 1) {
        // single line also gets a small shake for better feedback
        const phone = document.querySelector('.phone');
        if (phone) { phone.classList.remove('shake'); void phone.offsetWidth; phone.classList.add('shake'); setTimeout(() => phone.classList.remove('shake'), 400); }
        try { navigator.vibrate && navigator.vibrate(40); } catch(e){}
      }
      say(`${lines.length}줄 매칭! ` + (n < lines.length ? `자리가 부족해 ${n}기만 소환` : `${n}기 소환`) + (legends ? ' · 🌈 전설 유닛!' : '') + (jackpot ? ' · ✨ 잭팟 보너스 🔷+' + (lines.length >= 3 ? 4 : 2) + (lines.length >= 3 ? ' (스핀 +2)' : '') : ''), n > 0);
      updateHud();
      return lines.length;
    }

    // 스핀이 시작되면 true, 거절되면 false (이유는 로그로 안내)
    function doSpin() {
      if (G.spinning || G.phase === 'over') return false;
      if (G.spins <= 0) { say('남은 횟수가 없어요. 웨이브를 클리어하면 충전됩니다'); return false; }
      if (G.gold < spinCost()) { say('골드가 부족해요'); return false; }
      if (G.units.length >= maxUnits() && G.bench.length >= BENCH_MAX) {
        say('⚠ 유닛 슬롯 가득! 흡수해서 자리를 비워야 스핀할 수 있어요');
        return false;
      }

      G.spinning = true; G.nudge = false;
      G.gold -= spinCost(); G.spins -= 1;
      updateHud(); say('🎰 스핀 중...');

    // ★2 클래스 선택 / ★3 최종 승급(각성 or 숙련) 팝업

    let suppressBoardClickUntil = 0;
    unitBoard.addEventListener('click', e => {

    function renderBoard() {

    // ========== 스테이지 / 난이도 데이터 ==========

    const STAGES = [
      { n: '잊혀진 숲', ic: '🌲', rule: '빠른 적이 떼로 몰려옴', cnt: 1.3, spdM: 0.85,

      { n: '심연의 동굴', ic: '🕳️', rule: '수는 적지만 매우 단단함', cnt: 0.75, hpM: 1.4,
        roster: [['🦇', 0.8, 0.8, 0.75, 'swift'], ['🐛', 1.4, 1, 1.5, 'tank'], ['🪨', 2, 1.1, 1.8, 'tank']], boss: { ic: '🪱', n: '심연의 거대 벌레', k: 'worm' } },

    const CLR = (s, d) => !!META.clear[s + '-' + d];
    const stageOpen = s => s === 0 || CLR(s - 1, 0);
    const diffOpen = (s, d) => stageOpen(s) && (d === 0 || CLR(s, d - 1));

    // ========== 로비 = 스테이지 선택 ==========

    // ========== 웨이브 / 자동 전투 ==========
    function mkEnemy(icon, hp, atk, spd, role='grunt') {

    }

    function startWave() {
      if (G.phase !== 'prep') return;
      if (!G.units.length) { battleMsg.textContent = G.bench.length ? '출전 유닛이 없어요. 예비 유닛을 필드로 드래그하세요' : '유닛이 없어요. 슬롯을 돌려 먼저 소환하세요'; return; }

      let bname = '';

        G.enemies.push(b);

    function bossAct(e, now) {
      const p = e.pow, k = e.boss;
      const hitAll = m => { G.units.forEach(u => hurt(u, e.atk * m * p, null)); pop(e.atk * m * p, 'L', '#fb923c'); };
      const spawn = (ic, n) => { for (let i = 0; i < n && G.enemies.length < 12; i++) { const m = mkEnemy(ic, Math.round(e.maxHp * 0.08), Math.round(e.atk * 0.5 * 10) / 10, 0.7, 'swift'); m.dr = 0; m.dodge = 0; G.enemies.push(m); } };
      if (k === 'forest') spawn('🐺', 2);
      else if (k === 'worm') e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.1 * p);
      else if (k === 'slam') hitAll(0.9);
      else if (k === 'ruler') { e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.06 * p); const t = G.units[Math.floor(Math.random() * G.units.length)]; if (t) t.stun = 1.5; }
      else if (k === 'rain') hitAll(0.8);
      else if (k === 'rift') { G.units.forEach(u => u.stun = 1); hitAll(0.5); spawn('👽', 1); }
      battleMsg.textContent = `⚠ ${e.bname} · ${BOSS_SKILL[k]}!`;
    }

    function stageClear() {
      G.phase = 'over';
      const s = G.stage, d = G.diff, first = !CLR(s, d);
      const rb = Math.round((20 + 6 * s) * DIFFS[d].rw * (first ? 2 : 0.5));
      META.ruby += rb; G.runRuby += rb; META.clear[s + '-' + d] = 1; saveMeta();
      const notes = [];
      if (first) {
        if (d < 2) notes.push(`${DIFFS[d + 1].n} 난이도 해금`);
        if (d === 0 && s < 5) notes.push(`${STAGES[s + 1].n} 해금`);
        if (d === 0 && s === 5) notes.push('♾️ 무한 모드 해금');
      }
      $('rsTitle').textContent = '🏆 STAGE CLEAR';
      $('rsText').innerHTML = `${STAGES[s].n} (${DIFFS[d].n}) 클리어!<br>${STAGES[s].boss.n} 처치 · 💎 +${rb}${first ? ' (최초 보너스)' : ''}<br>${notes.join(' · ') || '&nbsp;'}`;
      const next = s < 5 && stageOpen(s + 1);
      $('rsNext').style.display = next ? '' : 'none';
      $('rsBtn').textContent = '재도전';
      startBtn.textContent = '다시 시작'; startBtn.disabled = false;
      battleMsg.textContent = `🏆 ${STAGES[s].n} 클리어!`;
      $('resultScreen').classList.add('show');
      updateHud();
    }

    let lastFieldRender = 0;
    function tick() {
      const dt = 0.1, now = performance.now(), st = themeOf();
      G.units.forEach(u => {
        if (u.regen) u.hp = Math.min(u.maxHp, u.hp + u.maxHp * u.regen * dt);
        if (u.rvT > 0) u.rvT -= dt;
        if (u.stun > 0) { u.stun -= dt; return; } // 기절: 행동 불가
        u.cd -= dt;
        if (u.cd <= 0 && G.enemies.some(e => e.hp > 0)) {
          // 각 유닛은 독립적인 공격 주기를 유지합니다. 먼저 쓰러질 적을 집중 공격하고,
          // 해당 적이 쓰러지면 같은 틱의 다음 유닛은 살아 있는 다음 적을 공격합니다.
          const living = G.enemies.filter(e => e.hp > 0);
          const target = living.reduce((best, e) => (e.hp / e.maxHp < best.hp / best.maxHp ? e : best), living[0]);
          target.hitAt = now; u.attackAt = now; u.cd = u.spd * u.spdM;
          if (Math.random() < (target.dodge || 0)) pop(0, 'R', '#9aa3c0'); // 회피
          else {
            // 자유 배치: 근접 유닛이 뒤쪽(fx 낮음)에 있으면 약간의 페널티
            const backPenalty = (MELEE.includes(u.name) && (u.fx || 50) < 40) ? 0.75 : 1;
            let dmg = u.atk * (1 - (target.dr || 0)) * backPenalty;
            if (u.rage) dmg *= 1 + u.rage * (1 - u.hp / u.maxHp);
            if (u.exec && target.hp / target.maxHp < 0.3) dmg *= 1 + u.exec;
            if (u.fs) { dmg *= 2; u.fs = false; }
            const crit = u.crit && Math.random() < u.crit; if (crit) dmg *= 2;
            const I = u.iL || {};
            if (I.buildup) { if (u.bu) { dmg *= 1 + lerp(I.buildup, 0.25, 0.8); u.bu = false; } else u.bu = true; }
            if (I.overdrive && u.od) { dmg *= 1 + lerp(I.overdrive, 1, 3); u.od = false; }
            if (u.rvT > 0) dmg *= 1 + u.rvA;
            if (target.soul > 0) dmg *= 1.5;
            target.hp -= dmg;
            if (u.steal) u.hp = Math.min(u.maxHp, u.hp + dmg * u.steal);
            if (u.burn) { target.burn = 3; target.burnDps = Math.max(target.burnDps || 0, u.atk * u.burn); }
            pop(dmg, 'R', crit ? '#fbbf24' : '#e8eaf0');
            u.hits = (u.hits || 0) + 1;
            const alive = () => G.enemies.filter(x => x !== target && x.hp > 0);
            const hitE = (e, m, col) => { const d = u.atk * m * (1 - (e.dr || 0)) * (e.soul > 0 ? 1.5 : 1); e.hp -= d; e.hitAt = now; pop(d, 'R', col || '#a78bfa'); };
            if (I.volley && u.hits % 3 === 0) hitE(target, lerp(I.volley, 0.4, 1.3));
            if (I.pierce) alive().slice(0, Math.round(lerp(I.pierce, 1, 3))).forEach(e => hitE(e, lerp(I.pierce, 0.25, 0.35)));
            if (I.transfer) alive().slice(0, Math.round(lerp(I.transfer, 1, 3))).forEach(e => { e.hp -= dmg * 0.3; e.hitAt = now; });
            if (I.bash && Math.random() < 0.18) target.stun = Math.max(target.stun || 0, lerp(I.bash, 0.5, 1.3));
            if (I.blind && Math.random() < 0.16) target.blind = lerp(I.blind, 0.4, 1.3);
            if (I.knockback && Math.random() < 0.18) target.cd += lerp(I.knockback, 0.8, 2);
            if (I.poison && Math.random() < 0.25) { target.psn = Math.round(lerp(I.poison, 2, 5)); target.psnPct = lerp(I.poison, 0.012, 0.02); }
            if (I.shrink && Math.random() < lerp(I.shrink, 0.1, 0.2)) { target.shr = 3; target.shrP = lerp(I.shrink, 0.2, 0.4); }
            if (I.soulsplit) target.soul = lerp(I.soulsplit, 3, 5);
            if (I.meteor && Math.random() < 0.1) G.enemies.filter(x => x.hp > 0).slice(0, 3).forEach(e => hitE(e, lerp(I.meteor, 1.8, 3), '#fb923c'));
            if (I.skyward && Math.random() < 0.12) { target.stun = Math.max(target.stun || 0, lerp(I.skyward, 0.8, 1.2)); hitE(target, lerp(I.skyward, 1.1, 2), '#7dd3fc'); }
            if (I.quake && Math.random() < 0.12) G.enemies.filter(x => x.hp > 0).forEach(e => { hitE(e, lerp(I.quake, 1, 1.8), '#f59e0b'); e.stun = Math.max(e.stun || 0, 1); });
            if (I.overdrive && target.hp <= 0) u.od = true;
            if (u.cleave && Math.random() < u.cleave) { const o = G.enemies.filter(x => x !== target && x.hp > 0); if (o.length) { const t2 = o[Math.floor(Math.random() * o.length)]; t2.hp -= dmg * 0.5 * (1 - (t2.dr || 0)); t2.hitAt = now; } }
          }
        }
        if (u.sub && G.enemies.length) { u.sk -= dt; if (u.sk <= 0) { u.sk = 4; useSkill(u, now); } }
        if (u.adv && G.enemies.length) { u.ask -= dt; if (u.ask <= 0) { u.ask = ADV[u.name].cd; advSkill(u, now); } }
      });
      G.enemies = G.enemies.filter(e => e.hp > 0);

      G.enemies.forEach(e => {
        if (e.burn > 0) { e.burn -= dt; e.hp -= e.burnDps * dt; } // 상태이상: 화상
        if (e.psn > 0) { e.psn -= dt; e.hp -= e.maxHp * e.psnPct * 2 * dt * (e.boss ? 0.25 : 1); } // 중독 (보스는 1/4)
        if (e.soul > 0) e.soul -= dt;
        if (e.shr > 0) e.shr -= dt;
        if (e.blind > 0) e.blind -= dt;
        if (e.stun > 0) { e.stun -= dt; return; } // 상태이상: 기절
        if (e.boss) { e.bs -= dt; if (e.bs <= 0) { e.bs = e.bi; bossAct(e, now); } }
        e.cd -= dt;
        if (e.cd <= 0) {
          e.cd = e.spd * (e.shr > 0 ? 1.25 : 1);
          if (e.blind > 0 && G.units.length) pop(0, 'L', '#9aa3c0'); // 실명: 공격 빗나감
          else if (G.units.length) {
            const tg = pickTarget(e, st), sm = e.shr > 0 ? 1 - e.shrP : 1;
            hurt(tg, e.atk * sm * (tg.name === 'Guard' ? 0.75 : 1), e); pop(e.atk * sm, 'L', '#f87171');
            if (e.splash) G.units.forEach(a => { if (a !== tg) hurt(a, e.atk * e.splash, null); });
          } else G.baseHp -= e.atk;
        }
      });
      if (st.burnU && G.units.length) { const bd = (0.5 + 0.12 * G.wave) * DIFFS[G.diff].atk * dt; G.units.forEach(u => u.hp -= bd); } // 붉은 지옥: 지속 화염
      G.units.forEach(u => { if (u.hp <= 0 && u.iL && u.iL.revival && !u.rv2) { u.rv2 = true; u.hp = u.maxHp * lerp(u.iL.revival, 0.4, 0.8); u.sh = 0; u.rvT = lerp(u.iL.revival, 8, 16); u.rvA = lerp(u.iL.revival, 0.2, 0.4); pop(u.hp, 'L', '#fde68a'); } }); // 부활 각인
      G.units.forEach(u => { if (u.hp <= 0 && u.leg && u.name === 'Phoenix' && !u.rev) { u.rev = true; u.hp = u.maxHp * 0.5; u.sh = 0; pop(u.maxHp * 0.5, 'L', '#fb923c'); } }); // 불사조 부활
      const before = G.units.length;
      G.units = G.units.filter(u => u.hp > 0);
      if (G.units.length !== before) renderBoard();

      updateHud();
      if (now - lastFieldRender >= 100) { renderField(); lastFieldRender = now; }
      if (G.baseHp <= 0) endGame();
      else if (!G.enemies.length) clearWave();
    }

    function clearWave() {
      clearInterval(timer);
      const interest = Math.min(150, Math.floor(G.gold * (0.05 + 0.03 * iLv('p_int')))); // 전술적 이자: 보유 골드 비례
      const reward = Math.round((180 + G.wave * 50) * (G.core === 'rich' ? 1.5 : 1) * (1 + 0.12 * iLv('p_gold'))) + interest;
      G.gold += reward;
      const rb = 2 + (G.wave % 5 === 0 ? 5 : 0); // 보스 웨이브 보너스
      META.ruby += rb; G.runRuby += rb; META.best = Math.max(META.best, G.wave); saveMeta();
      const sp = 3 + iLv('p_spin'); G.spins += sp;
      if (G.stage >= 0 && G.wave >= waveMax()) { stageClear(); return; }
      const ess = 3 + (G.wave % 5 === 0 ? 4 : 0) + iLv('p_ess'); G.essence += ess; newStock(); // 정수: 웨이브 클리어 보상(보스 웨이브 보너스), 상점 목록 갱신
      G.wave += 1;
      G.phase = 'prep';
      G.units.forEach(u => u.hp = u.maxHp);
      startBtn.disabled = false;
      battleMsg.textContent = `클리어! 💰+${reward}${interest ? '(이자 ' + interest + ')' : ''} 💎+${rb} 🔷+${ess} 🎰+${sp} · 슬롯을 돌리고 다음 웨이브를 시작하세요`;
      renderBoard(); updateHud(); renderField();
    }

    function endGame() {
      clearInterval(timer);
      G.phase = 'over';
      startBtn.disabled = false;
      startBtn.textContent = '다시 시작';
      $('rsTitle').textContent = 'GAME OVER'; $('rsNext').style.display = 'none'; $('rsBtn').textContent = '다시 시작';
      $('rsText').innerHTML = `${G.stage >= 0 ? STAGES[G.stage].n + ' (' + DIFFS[G.diff].n + ') · ' : '♾️ 무한 모드 · '}Wave ${G.wave} 도달<br>이번 판 💎 ${G.runRuby} 획득 (보유 ${META.ruby})<br>상점에서 업그레이드 후 다시 도전하세요`;
      $('resultScreen').classList.add('show');
      battleMsg.textContent = `GAME OVER · Wave ${G.wave}에서 기지가 무너졌어요`;
    }

    function resetGame() {
      clearInterval(timer);
      Object.assign(G, { gold: 900 + 100 * META.up.gold, spins: 7 + 2 * META.up.spin, wave: 1, baseHp: 100, phase: 'prep', spinning: false, units: [], bench: [], enemies: [], runRuby: 0, core: null, essence: 5, stock: [], rerolls: 0, items: {} }); newStock();
      $('resultScreen').classList.remove('show');
      G.grid = Array.from({ length: 9 }, () => weightedRandom()); G.nudge = false; sel = -1;
      cells.forEach(c => c.classList.remove('matched'));
      drawGrid();
      summonUnit(SYMBOLS[0]); // 시작 유닛
      startBtn.textContent = '▶ 웨이브 시작';
      startBtn.disabled = false;
      battleMsg.textContent = '슬롯으로 유닛을 모으세요. 필드에서 드래그해 자유롭게 배치하세요!';
      say('슬라이드 바를 아래로 내려 스핀하세요');
      showCore();
      renderBoard(); updateHud(); renderField();
    }

    // ========== 특성 / 서브클래스 / 스킬 / 유닛 상세 ==========
    const lerp = (lv, a, b) => a + (b - a) * (Math.min(5, Math.max(1, lv)) - 1) / 4;
    const pc = v => Math.round(v), f1 = v => v.toFixed(1);
    const TIER_VAL = { n: 1, a: 2, r: 3, l: 4 }, CONV_BONUS = { n: 1, a: 2, r: 3, l: 5 };
    const impCap = u => ({ n: 1, a: 2, r: 3, l: 4 })[tierOf(u)]; // 등급별 각인 슬롯
    const IMPR = {
      buildup:  { n: '축적',   d: l => `기본 공격 후 다음 기본 공격의 공격력 +${pc(lerp(l, 25, 80))}%` },
      volley:   { n: '연사',   d: l => `3번째 기본 공격마다 같은 대상에 공격력 ${pc(lerp(l, 40, 130))}% 추가 타격` },
      pierce:   { n: '관통',   d: l => `기본 공격이 뒤쪽 적 최대 ${pc(lerp(l, 1, 3))}명을 관통해 ${pc(lerp(l, 25, 35))}% 피해` },
      transfer: { n: '전이',   d: l => `공격 시 입힌 피해의 30%가 다른 적 ${pc(lerp(l, 1, 3))}명에게 전이` },
      overdrive:{ n: '폭주',   d: l => `적 처치 후 다음 기본 공격의 공격력 +${pc(lerp(l, 100, 300))}%` },
      bash:     { n: '강타',   d: l => `공격 시 18% 확률로 대상 ${f1(lerp(l, 0.5, 1.3))}초 기절` },
      blind:    { n: '실명',   d: l => `공격 시 16% 확률로 대상 ${f1(lerp(l, 0.4, 1.3))}초 실명 (공격 빗나감)` },
      knockback:{ n: '밀치기', d: l => `공격 시 18% 확률로 대상을 밀쳐 다음 공격 ${f1(lerp(l, 0.8, 2))}초 지연` },
      poison:   { n: '중독',   d: l => `공격 시 25% 확률로 ${pc(lerp(l, 2, 5))}초간 중독 (0.5초마다 최대 체력의 ${f1(lerp(l, 1.2, 2))}%)` },
      block:    { n: '방어',   d: l => `받는 공격을 ${pc(lerp(l, 15, 30))}% 확률로 방어 (무효)` },
      shrink:   { n: '축소',   d: l => `공격 시 ${pc(lerp(l, 10, 20))}% 확률로 3초간 대상 축소 (공격력 -${pc(lerp(l, 20, 40))}%, 공속 저하)` },
      meteor:   { n: '메테오', d: l => `공격 시 10% 확률로 운석 낙하: 적 최대 3명에게 ${pc(lerp(l, 180, 300))}% 피해` },
      revival:  { n: '부활',   d: l => `웨이브마다 1회, 쓰러지면 체력 ${pc(lerp(l, 40, 80))}%로 부활 + ${pc(lerp(l, 8, 16))}초간 공격력 +${pc(lerp(l, 20, 40))}%` },
      soulsplit:{ n: '영혼 분리', d: l => `공격 시 대상의 영혼을 ${pc(lerp(l, 3, 5))}초간 분리: 대상이 받는 피해 +50%` },
      skyward:  { n: '승천격', d: l => `공격 시 12% 확률로 대상을 ${f1(lerp(l, 0.8, 1.2))}초 띄우고 ${pc(lerp(l, 110, 200))}% 피해` },
      quake:    { n: '지진',   d: l => `공격 시 12% 확률로 모든 적에게 ${pc(lerp(l, 100, 180))}% 피해 + 1초 기절` },
    };
    // 제물의 계열·등급 → 넘겨주는 고유 각인 (진화·전직과 무관)
    const IMPR_OF = { 'n:Warrior': 'buildup', 'n:Archer': 'volley', 'n:Guard': 'pierce', 'n:Mage': 'transfer', 'n:Cavalry': 'overdrive',
      'a:Warrior': 'bash', 'a:Archer': 'blind', 'a:Guard': 'knockback', 'a:Mage': 'poison', 'a:Cavalry': 'block',
      'r:Special': 'shrink', 'l:Dragon': 'meteor', 'l:Seraph': 'revival', 'l:Vampire': 'soulsplit', 'l:Storm': 'skyward', 'l:Phoenix': 'quake' };
    const imprOf = u => IMPR_OF[tierOf(u) + ':' + u.name];
    const slotDots = u => '◆'.repeat(u.imps.length) + '◇'.repeat(Math.max(0, impCap(u) - u.imps.length)); // 각인 슬롯 (채움/빈칸)
    function slotBoxes(u, p) { // p = 흡수 미리보기(선택)
      const cap = impCap(u), b = [];
      u.imps.forEach(x => { const up = p && p.mode === 'levelup' && x.id === p.id; b.push(`<span class="slot on${up ? ' new' : ''}">${IMPR[x.id].n} LV${x.lv}${up ? ' → ' + Math.min(5, x.lv + 1) : ''}</span>`); });
      if (p && p.mode === 'equip') b.push(`<span class="slot new">＋ ${IMPR[p.id].n} LV1</span>`);
      for (let i = b.length; i < cap; i++) b.push('<span class="slot">빈 칸</span>');
      if (p && p.mode === 'full') b.push(`<span class="slot new">새 각인 ${IMPR[p.id].n} (슬롯 없음)</span>`);
      return `<div class="slots">${b.join('')}</div>`;
    }
    const TRAITS = [
      { n: '강인',   d: 'HP +30%',            hp: 1.3 },
      { n: '날카로움', d: '공격력 +25%',        atk: 1.25 },
      { n: '신속',   d: '공격 간격 -20%',      spd: 0.8 },
      { n: '흡혈',   d: '공격 시 피해의 30% 회복', steal: 0.3 },
      { n: '화염',   d: '공격 시 화상 (3초간 초당 ATK의 20%)', burn: 0.2 },
      { n: '치명',   d: '20% 확률로 2배 피해', crit: 0.2 },
      { n: '회피',   d: '20% 확률로 피격 무효', dodge: 0.2 },
      { n: '가시',   d: '받은 피해의 30%를 공격자에게 반사', thorns: 0.3 },
      { n: '선제',   d: '웨이브 첫 공격이 즉시 발동, 피해 2배', first: 1 },
      { n: '처형',   d: '체력 30% 이하 적에게 피해 +50%', exec: 0.5 },
      { n: '보호막', d: '웨이브 시작 시 최대 HP 25% 보호막', shieldP: 0.25 },
      { n: '분노',   d: '잃은 체력 비율만큼 공격력 최대 +60%', rage: 0.6 },
      { n: '재생',   d: '초당 최대 HP 2% 회복', regen: 0.02 },
      { n: '광역',   d: '공격 시 25% 확률로 다른 적에게 50% 피해', cleave: 0.25 },
    ];
    const traitCap = u => u.leg ? 3 : u.adv ? 2 : 1; // 일반 1 / Advanced 2 / 전설 3
    const pickTraits = n => { const a = TRAITS.map((_, i) => i); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, n); };
    const ADV_RATE = 0.08;
    const rollV = adv => (adv ? 0.95 : 0.85) + Math.random() * 0.3; // 소환 시 HP/ATK 편차
    const LEGENDS = [
      { icon: '🐉', name: 'Dragon',  hp: 90, atk: 20, spd: 1.0 },
      { icon: '😇', name: 'Seraph',  hp: 80, atk: 12, spd: 1.1 },
      { icon: '🧛', name: 'Vampire', hp: 70, atk: 16, spd: 0.9 },
      { icon: '⚡', name: 'Storm',   hp: 55, atk: 18, spd: 1.0 },
      { icon: '🔥', name: 'Phoenix', hp: 85, atk: 16, spd: 1.0 },
    ];
    const ADV = {
      Dragon:  { n: '용의 숨결', cd: 5, d: '5초마다 적 전체에 공격력 ×2 + 화상 · 피해 ×1.25 기본 강화' },
      Seraph:  { n: '성광',     cd: 6, d: '6초마다 아군 전체 HP 30% 회복 + 보호막 10%' },
      Vampire: { n: '흡혈 일격', cd: 4, d: '4초마다 가장 약한 적에게 ×3 피해, 피해의 50% 회복 · 공격 시 50% 흡혈' },
      Storm:   { n: '연쇄 번개', cd: 4, d: '4초마다 적 4기에게 ×1.4 피해 + 짧은 기절' },
      Phoenix: { n: '불사조의 불꽃', cd: 5, d: '5초마다 적 전체 ×1.2 피해 · 웨이브마다 1회 HP 50%로 부활' },
      Warrior: { n: '일격', cd: 5, d: '5초마다 체력이 가장 낮은 적에게 공격력 ×2.5' },
      Archer:  { n: '연사', cd: 5, d: '5초마다 적 3기에게 공격력 ×1.2' },
      Guard:   { n: '철벽', cd: 6, d: '6초마다 아군 전체에 최대 HP 10% 보호막' },
      Mage:    { n: '운석', cd: 6, d: '6초마다 적 전체에 공격력 ×1.5' },
      Cavalry: { n: '돌격', cd: 5, d: '5초마다 적 하나에 ×2 피해 + 기절 1.5초' },
      Special: { n: '축복', cd: 6, d: '6초마다 아군 전체가 즉시 공격 준비' },
    };
    const vrTag = u => { const v = ((u.vh || 1) + (u.va || 1)) / 2; return v >= 1.1 ? '<span class="vr">▲▲</span>' : v >= 1.03 ? '<span class="vr">▲</span>' : v <= 0.9 ? '<span class="vr dn">▼</span>' : ''; };
    function hurt(u, dmg, src) {
      if (u.dodge && Math.random() < Math.min(0.5, u.dodge)) { pop(0, 'L', '#9aa3c0'); return; }
      if (u.iL && u.iL.block && Math.random() < lerp(u.iL.block, 0.15, 0.3)) { pop(0, 'L', '#9aa3c0'); return; } // 방어 각인
      const raw = dmg;
      if (u.sh > 0) { const a = Math.min(u.sh, dmg); u.sh -= a; dmg -= a; }
      u.hp -= dmg; u.hitAt = performance.now();
      if (src && u.thorns) src.hp -= raw * u.thorns;
    }
    function showSkillPop(text) {
      const el = document.createElement('div');
      el.className = 'skill-pop';
      el.textContent = text;
      $('fx').appendChild(el);
      setTimeout(() => el.remove(), 1100);
    }
    function advSkill(u, now) {
      const alive = G.enemies.filter(e => e.hp > 0); if (!alive.length) return;
      const low = alive.reduce((b, x) => x.hp / x.maxHp < b.hp / b.maxHp ? x : b, alive[0]);
      const hit = (e, m) => { const d = u.atk * m * (1 - (e.dr || 0)); e.hp -= d; e.hitAt = now; pop(d, 'R', '#f0abfc'); return d; };
      const skillName = (ADV[u.name] && ADV[u.name].n) || '스킬';
      showSkillPop(`${u.icon} ${skillName}`);
      if (u.leg) {
        if (u.name === 'Dragon') alive.forEach(e => { hit(e, 2); e.burn = 3; e.burnDps = Math.max(e.burnDps || 0, u.atk * 0.3); });
        else if (u.name === 'Seraph') G.units.forEach(a => { a.hp = Math.min(a.maxHp, a.hp + a.maxHp * 0.3); a.sh = (a.sh || 0) + a.maxHp * 0.1; });
        else if (u.name === 'Vampire') { const d = hit(low, 3); u.hp = Math.min(u.maxHp, u.hp + d * 0.5); }
        else if (u.name === 'Storm') alive.slice(0, 4).forEach(e => { hit(e, 1.4); e.stun = Math.max(e.stun || 0, 0.5); });
        else alive.forEach(e => hit(e, 1.2));
        return;
      }
      if (u.name === 'Warrior') hit(low, 2.5);
      else if (u.name === 'Archer') alive.slice(0, 3).forEach(e => hit(e, 1.2));
      else if (u.name === 'Guard') G.units.forEach(a => a.sh = (a.sh || 0) + a.maxHp * 0.1);
      else if (u.name === 'Mage') alive.forEach(e => hit(e, 1.5));
      else if (u.name === 'Cavalry') { hit(low, 2); low.stun = 1.5; }
      else G.units.forEach(a => a.cd = 0);
    }
    // 유닛별 전직 트리: ★2에서 A/B 루트 선택 → ★3에서 최종 클래스로 자동 진화 (Slotbound 방식)
    // n=[2성 클래스, 3성 클래스], an=Advanced 유닛 전용 이름, fx=능력/스킬 프리셋
    const FX = {
      bruiser:  [{ atk: 1.25, hp: 1.1, sk: { k: 'smash', m: 2.5, st: 1 } },   { atk: 1.5, hp: 1.25, sk: { k: 'smash', m: 3.5, st: 1.5 } }],
      assassin: [{ atk: 1.3, spd: 0.92, sk: { k: 'snipe', m: 3 } },           { atk: 1.55, spd: 0.85, sk: { k: 'snipe', m: 4.5 } }],
      tank:     [{ hp: 1.4, sk: { k: 'shield', p: 0.12 } },                   { hp: 1.7, atk: 1.15, sk: { k: 'shield', p: 0.2 } }],
      healer:   [{ hp: 1.15, sk: { k: 'heal', p: 0.12 } },                    { hp: 1.3, atk: 1.1, sk: { k: 'heal', p: 0.2 } }],
      volley:   [{ atk: 1.15, spd: 0.9, sk: { k: 'multi', n: 3, m: 1.3 } },   { atk: 1.3, spd: 0.85, sk: { k: 'multi', n: 5, m: 1.6 } }],
      nuker:    [{ atk: 1.2, sk: { k: 'aoe', m: 1 } },                        { atk: 1.4, sk: { k: 'aoe', m: 1.6 } }],
      charger:  [{ atk: 1.2, hp: 1.15, sk: { k: 'smash', m: 2, st: 1.5 } },   { atk: 1.4, hp: 1.3, sk: { k: 'smash', m: 3, st: 2 } }],
      rally:    [{ spd: 0.9, sk: { k: 'rally' } },                            { spd: 0.8, atk: 1.15, sk: { k: 'rally', heal: 0.05 } }],
    };
    const CTREE = {
      Warrior: { A: { n: ['병사', '기사'], an: ['엘프 병사', '엘프 기사'], fx: 'bruiser' },            B: { n: ['해적', '해적왕'], an: ['사수 병사', '바그'], fx: 'assassin' } },
      Archer:  { A: { n: ['석궁수', '장궁병'], an: ['엘프 궁수', '하이 엘프'], fx: 'volley' },          B: { n: ['순찰자', '명사수'], an: ['레인저', '데드아이'], fx: 'assassin' } },
      Guard:   { A: { n: ['창위병', '근위병'], an: ['엘프 보병', '하이 엘프 보병'], fx: 'tank' },      B: { n: ['약탈자', '무법자'], an: ['바이킹', '바바리안'], fx: 'bruiser' } },
      Mage:    { A: { n: ['주술사', '대주술사'], an: ['엘프 법사', 'Elf Sage'], fx: 'nuker' },          B: { n: ['치유술사', '대사제'], an: ['야생 법사', 'Primitive Mage'], fx: 'healer' } },
      Cavalry: { A: { n: ['돌격병', '중기병'], an: ['Elf Cavalry', 'High Elf Cavalry'], fx: 'charger' }, B: { n: ['도끼 기병', '무법 기병'], an: ['Savage Cavalry', 'Raging Cavalry'], fx: 'volley' } },
      Special: { A: { n: ['Trickster', 'Illusionist'], fx: 'rally' },                                  B: { n: ['Ferret Tamer', 'Ringmaster'], fx: 'nuker' } },
      Dragon:  { A: { n: ['용기사', '용왕'], fx: 'bruiser' },    B: { n: ['화염룡', '멸화룡'], fx: 'nuker' } },
      Seraph:  { A: { n: ['치천사', '대천사'], fx: 'healer' },   B: { n: ['심판자', '대심판관'], fx: 'assassin' } },
      Vampire: { A: { n: ['흡혈귀족', '혈왕'], fx: 'assassin' }, B: { n: ['박쥐군주', '야행제왕'], fx: 'volley' } },
      Storm:   { A: { n: ['뇌신', '천둥제'], fx: 'volley' },     B: { n: ['폭풍술사', '태풍왕'], fx: 'nuker' } },
      Phoenix: { A: { n: ['불꽃술사', '홍염제'], fx: 'nuker' },  B: { n: ['재생의 새', '부활의 불사조'], fx: 'healer' } },
    };
    const CLASS_TOTAL = Object.keys(CTREE).length * 2;
    const routeName = (u, r, t) => { const c = CTREE[u.name]?.[r]; return c ? ((u.adv && !u.leg && c.an) ? c.an : c.n)[t] : '?'; };
    function fxDesc(f) {
      const p = [];
      if (f.atk) p.push(`공격력 +${Math.round((f.atk - 1) * 100)}%`);
      if (f.hp) p.push(`HP +${Math.round((f.hp - 1) * 100)}%`);
      if (f.spd) p.push(`공격 간격 -${Math.round((1 - f.spd) * 100)}%`);
      const k = f.sk;
      p.push('4초마다 ' + ({ smash: `체력 높은 적에게 ×${k.m}${k.st ? ' + 기절 ' + k.st + '초' : ''}`, snipe: `체력 낮은 적에게 ×${k.m}`, multi: `적 ${k.n}기에게 ×${k.m}`, aoe: `적 전체 ×${k.m}`, heal: `아군 전체 HP ${Math.round(k.p * 100)}% 회복`, shield: `아군 전체에 최대 HP ${Math.round(k.p * 100)}% 보호막`, rally: '아군 전체 즉시 공격 준비' + (k.heal ? ` + HP ${Math.round(k.heal * 100)}% 회복` : '') })[k.k]);
      return p.join(' · ');
    }
    // 유닛의 현재 클래스 (u.sub = 루트 'A'/'B', 성급이 3이면 최종 클래스)
    function classOf(u) {
      const r = u.sub && CTREE[u.name]?.[u.sub]; if (!r) return null;
      const t = starOf(u) >= 3 ? 1 : 0, f = FX[r.fx][t];
      return { n: routeName(u, u.sub, t), mod: f, sk: f.sk, d: fxDesc(f) };
    }
    function useSkill(u, now) {
      const c = classOf(u); if (!c || !G.enemies.length) return;
      const k = c.sk, es = G.enemies;
      const dmg = (e, m) => { e.hp -= u.atk * m; e.hitAt = now; pop(u.atk * m, 'R', '#fbbf24'); };
      if (k.k === 'smash') { const e = es.reduce((b, x) => (x.hp > b.hp ? x : b), es[0]); dmg(e, k.m); if (k.st) e.stun = k.st; }
      else if (k.k === 'snipe') { const e = es.reduce((b, x) => (x.hp < b.hp ? x : b), es[0]); dmg(e, k.m); }
      else if (k.k === 'multi') es.slice(0, k.n).forEach(e => dmg(e, k.m));
      else if (k.k === 'aoe') es.forEach(e => dmg(e, k.m));
      else if (k.k === 'heal') G.units.forEach(a => a.hp = Math.min(a.maxHp, a.hp + a.maxHp * k.p));
      else if (k.k === 'shield') G.units.forEach(a => { a.sh = (a.sh || 0) + a.maxHp * k.p; });
      else if (k.k === 'rally') { G.units.forEach(a => { a.cd = 0; if (k.heal) a.hp = Math.min(a.maxHp, a.hp + a.maxHp * k.heal); }); }
      showSkillPop(`${u.icon} ${c.n}`);
    }

    let detIdx = -1;
    function renderDetail() {
      const u = getU(detIdx);
      if (!u) return closeDetail();
      const st = starOf(u), nx = nextStarLv(u), cls = u.leg ? ' leg' : u.adv ? ' adv' : '';
      const tierN = u.leg ? '🌈 전설' : u.adv ? '✨ Advanced' : '일반';
      const dv = v => { const n = Math.round(((v || 1) - 1) * 100); return (n >= 0 ? '+' : '') + n + '%'; };
      $('detailBody').innerHTML =
        `<div class="dcard${cls}"><div class="big">${u.icon}</div><div style="flex:1;min-width:0">` +
          `<div class="nm">${u.name} <small>${tierN}${detIdx >= 100 ? ' · 대기' : ''}</small></div>` +
          `<div class="stars">${'★'.repeat(st)}${'☆'.repeat(3 - st)} <small>Lv ${u.lv}/${MAX_LV} · 다음 ★ ${nx ? 'Lv ' + nx : '최대'}</small></div>` +
          `<div class="st"><span>❤️ HP ${u.maxHp}</span><span>⚔️ ATK ${u.atk}</span><span>⏱ 간격 ${(u.spd * u.spdM).toFixed(2)}s</span><span>각인 ${u.imps.length}/${impCap(u)}</span><span>편차 HP ${dv(u.vh)}</span><span>편차 ATK ${dv(u.va)}</span></div>` +
        `</div></div>` +
        `<div style="margin:-2px 0 8px"><div style="font-size:11px;color:#9aa3c0">각인 슬롯 ${u.imps.length}/${impCap(u)}</div>${slotBoxes(u)}</div>` +
        (u.adv ? `<div class="shop-row"><div class="info">${u.leg ? '🌈 전설' : '✨'} 전용 스킬 · ${ADV[u.name].n}<small>${ADV[u.name].d}</small></div></div>` : '') +
        `<div class="shop-row"><div class="info">각인 ${u.imps.length}/${impCap(u)}<small>${u.imps.map(x => IMPR[x.id].n + ' LV' + x.lv + ': ' + IMPR[x.id].d(x.lv)).join('<br>') || '없음 (다른 유닛을 흡수하면 얻어요)'}</small></div></div>` +
        `<div class="shop-row"><div class="info">제물로 쓰면<small>고유 각인 ${imprOf(u) ? IMPR[imprOf(u)].n + ' (LV1): ' + IMPR[imprOf(u)].d(1) : '-'}</small></div></div>` +
        (() => {
          const cl = classOf(u), tr = CTREE[u.name];
          if (!tr) return '';
          return `<div class="shop-row"><div class="info">${cl ? '클래스 · ' + cl.n : '클래스 (전직)'}<small>${cl ? cl.d + (st < 3 ? ' · ★3 진화: ' + routeName(u, u.sub, 1) : ' · 최종 클래스') : (st >= 2 ? '루트를 선택하세요 (변경 불가)' : '★2에서 A/B 루트 선택 (Lv ' + STAR_AT[tierOf(u)][0] + ') → ★3 최종 진화')}</small></div>` +
            (!u.sub && st >= 2 ? ['A', 'B'].map(r => `<button class="buy" data-sub="${r}">${routeName(u, r, 0)}</button>`).join('') : '') + `</div>`;
        })() +
        (detIdx >= 100 ? `<div class="shop-row"><div class="info">출전<small>${G.units.length >= maxUnits() ? '출전 자리가 가득 찼어요 (필드 유닛 위로 드래그해 흡수하세요)' : '필드에 내보냅니다'}</small></div><button class="buy" data-deploy="1" ${G.phase !== 'prep' || G.units.length >= maxUnits() ? 'disabled' : ''}>출전</button></div>` : '') +
        `<div class="shop-row"><div class="info">잠금<small>잠그면 흡수 재료로 쓰이지 않아요</small></div><button class="buy" data-lock="1">${u.lock ? '🔒 해제' : '🔓 잠금'}</button></div>`;
    }
    $('detailBody').addEventListener('click', e => {
      const b = e.target.closest('.buy'), u = getU(detIdx);
      if (!b || !u) return;
      const msg = $('detailMsg');
      if (b.dataset.sub) { u.sub = b.dataset.sub; dexAdd('s', `${u.name}:${u.sub}`); applyStats(u); msg.textContent = `${classOf(u).n} 선택!`; }
      else if (b.dataset.awake) { u.awake = true; applyStats(u); updateHud(); msg.textContent = '각성!'; }
      else if (b.dataset.deploy) { if (G.phase === 'prep' && placeFromBench(detIdx - 100)) { closeDetail(); battleMsg.textContent = '대기 유닛 출전!'; } return; }
      else if (b.dataset.mast) { u.mast = true; applyStats(u); updateHud(); msg.textContent = '숙련!'; } else { u.lock = !u.lock; msg.textContent = u.lock ? '잠금' : '잠금 해제'; }
      renderBoard(); renderDetail(); renderField();
    });
    function openDetail() {
      $('detailMsg').textContent = '';
      renderDetail();
      $('detailPanel').classList.add('open');
      overlay.classList.add('show');
      mainArea.classList.add('dimmed');
    }
    function closeDetail() {
      $('detailPanel').classList.remove('open');
      overlay.classList.remove('show');
      mainArea.classList.remove('dimmed');
    }
    $('detailClose').addEventListener('click', closeDetail);
    overlay.addEventListener('click', closeDetail);
    $('rsBtn').addEventListener('click', () => resetGame());

    // ========== Core / 로비 / 도감 / 연출 ==========
    const CORES = [
      { id: 'lucky', n: '🍀 행운', d: '⭐ Special 등장 확률 ×2' },
      { id: 'rich',  n: '💰 풍요', d: '웨이브 클리어 골드 +50%' },
      { id: 'cheap', n: '🏷️ 절약', d: '스핀 비용 100 → 70' },
      { id: 'elite', n: '🎖️ 정예', d: '시작 유닛 +1 (랜덤)' },

    const spinCost = () => G.core === 'cheap' ? 70 : SPIN_COST;
    function showCore() {
      $('coreList').innerHTML = CORES.map(c => `<div class="shop-row"><div class="info">${c.n}<small>${c.d}</small></div><button class="buy" data-core="${c.id}">선택</button></div>`).join('');

    $('coreList').addEventListener('click', e => {

      if (!b) return;

      G.core = c.id;
      if (c.id === 'elite') summonUnit(weightedRandom(true));
      $('coreScreen').classList.remove('show');
      battleMsg.textContent = `Core ${c.n} · 필드에서 유닛을 드래그해 원하는 위치에 놓으세요`;
      updateHud();
    });
    $('rsLobby').addEventListener('click', () => { $('resultScreen').classList.remove('show'); renderLobby(); $('lobby').classList.add('show'); });

    function dexAdd(kind, v) { if (!META.dex[kind].includes(v)) { META.dex[kind].push(v); saveMeta(); } }
    function dexHtml() {
      const row = (a, b) => `<div class="shop-row"><div class="info">${a}<small>${b}</small></div></div>`;
      return SYMBOLS.filter(x => !x.prism).map(x => META.best >= (x.need || 0)
          ? row(`${x.icon} ${x.name}`, META.dex.u.includes(x.name) ? `HP ${x.hp} · ATK ${x.atk}` : '아직 소환하지 못했어요')
          : row('🔒 ???', `Wave ${x.need} 도달 시 해금`)).join('') +
        row('각인', Object.keys(IMPR).map(id => META.dex.t.includes(id) ? IMPR[id].n : '???').join(' · ')) +
        row('전직 루트', `${META.dex.s.filter(x => x.includes(':')).length}/${CLASS_TOTAL}`) +
        row('✨ Advanced', SYMBOLS.filter(x => !x.prism).map(x => META.dex.a.includes(x.name) ? '✨' + x.name : '???').join(' · ')) +
        row('🌈 전설 (Prism)', META.best >= 3 ? LEGENDS.map(l => META.dex.l.includes(l.name) ? l.icon + l.name : '???').join(' · ') : 'Wave 3 도달 시 Prism 심볼 해금') +
        row('기록', `최고 Wave ${META.best}`);
    }

    // 데미지 숫자 (side: 'R' = 적 쪽, 'L' = 아군 쪽)
    function pop(v, side, color) {
      const el = document.createElement('div');
      el.className = 'pop';
      const val = Math.round(v);
      el.textContent = val === 0 ? 'MISS' : val;
      el.style.color = color;
      el.style.fontSize = (val > 30 || val === 0) ? '16px' : '14px';
      el.style.fontWeight = '900';
      el.style.left = (side === 'R' ? 60 + Math.random() * 26 : 10 + Math.random() * 26) + '%';
      el.style.top = (22 + Math.random() * 32) + '%';
      $('fx').appendChild(el);
      setTimeout(() => el.remove(), 750);
    }
    // ========== 상점 / 영구 업그레이드 (💎) ==========
    const SAVE_KEY = 'slotBattleSave_v2';
    const LEGACY_SAVE_KEY = 'slotBattleSave_v1';
    const META = { ruby: 0, best: 0, clear: {}, unl: {}, dex: { u: [], t: [], s: [], a: [], l: [] }, up: { gold: 0, spin: 0, atk: 0, hp: 0, slot: 0, islot: 0 } };
    const maxUnits = () => MAX_UNITS + META.up.slot;

    // 영구 업그레이드: 다음 레벨 비용 = cost × (현재 Lv + 1)
    const UPGRADES = [
      { k: 'gold', name: '시작 골드',  desc: '런 시작 골드 +100', max: 5,  cost: 20 },
      { k: 'spin', name: '시작 스핀',  desc: '런 시작 스핀 +2',   max: 5,  cost: 20 },
      { k: 'atk',  name: '공격 강화',  desc: '유닛 공격력 +5%',   max: 10, cost: 15 },
      { k: 'hp',   name: '체력 강화',  desc: '유닛 체력 +5%',     max: 10, cost: 15 },
      { k: 'slot', name: '보드 확장',  desc: '최대 유닛 +1 (최대 8칸)', max: 3,  cost: 60 },
      { k: 'islot', name: '아이템 칸 확장', desc: '장착 아이템 칸 +1 (기본 6, 최대 8)', max: 2, cost: 50 },
    ];
    // 아이템: 구매 즉시 사용. use()가 false면 사용 불가(루비 차감 없음)
    const ITEMS = [
      { id: 'spin',   icon: '🎰', name: '스핀 팩',    desc: '스핀 +5회',          cost: 6, use: () => { G.spins += 5; return true; } },
      { id: 'gold',   icon: '💰', name: '골드 주머니', desc: '골드 +500',          cost: 8, use: () => { G.gold += 500; return true; } },
      { id: 'repair', icon: '🏰', name: '기지 수리',   desc: '기지 HP +50 (최대 100)', cost: 6, fail: '기지 HP가 이미 가득해요',
        use: () => { if (G.baseHp >= 100) return false; G.baseHp = Math.min(100, G.baseHp + 50); return true; } },
      { id: 'summon', icon: '🎫', name: '소환권',      desc: '랜덤 유닛 1기 즉시 소환', cost: 10, fail: '보드가 가득 찼어요',
        use: () => { if (G.units.length >= maxUnits() && G.bench.length >= BENCH_MAX) return false; summonUnit(weightedRandom(true)); return true; } },
      { id: 'advs',   icon: '✨', name: '승급 소환권', desc: 'Advanced 유닛 1기 즉시 소환', cost: 18, fail: '보드가 가득 찼어요',
        use: () => { if (G.units.length >= maxUnits() && G.bench.length >= BENCH_MAX) return false; summonUnit(weightedRandom(true), { adv: true }); return true; } },
    ];
    // 패시브 아이템: 정수로 구매/레벨업(최대 Lv3), 장착 칸(기본 6, 최대 8)을 차지. 일부는 루비(기원석)로 영구 해금
    const iLv = id => (G.items && G.items[id]) || 0;
    const itemCap = () => 6 + META.up.islot;
    const PASSIVES = [
      { id: 'p_atk',  icon: '⚔️', name: '공격의 인장',  d: l => `전 유닛 공격력 +${8 * l}%`, unl: 1 },
      { id: 'p_hp',   icon: '🛡️', name: '강철 부적',    d: l => `전 유닛 체력 +${8 * l}%`, unl: 1 },
      { id: 'p_gold', icon: '🪙', name: '행운의 동전',  d: l => `웨이브 클리어 골드 +${12 * l}%`, unl: 1 },
      { id: 'p_spin', icon: '🎰', name: '슬롯 조율기',  d: l => `웨이브 클리어 스핀 +${l}회`, unl: 1 },
      { id: 'p_spd',  icon: '👢', name: '신속의 장화',  d: l => `공격 간격 -${4 * l}%`, ruby: 25 },
      { id: 'p_ess',  icon: '🔷', name: '정수 결정',    d: l => `웨이브 클리어 정수 +${l}`, ruby: 30 },
      { id: 'p_abs',  icon: '🧪', name: '흡수 촉매',    d: l => `흡수할 때 흡수 LV +${l}`, ruby: 40 },
      { id: 'p_int',  icon: '📈', name: '복리 장부',    d: l => `골드 이자율 +${3 * l}%p (기본 5%)`, ruby: 40 },
    ].map(x => Object.assign(x, { passive: true }));
    const passiveOpen = p => p.unl || META.unl[p.id];
    const passiveCost = p => 7 + 4 * iLv(p.id);
    const equippedCount = () => Object.keys(G.items || {}).filter(k => G.items[k] > 0).length;
    const itemById = id => ITEMS.find(x => x.id === id) || PASSIVES.find(x => x.id === id);
    function reapplyAll() { [...G.units, ...G.bench].forEach(x => { const r = x.hp / x.maxHp; applyStats(x); x.hp = x.maxHp * r; }); }
    function unlockRows() {
      const rows = PASSIVES.filter(p => !passiveOpen(p)).map(p => `<div class="shop-row"><div class="info">🔓 ${p.icon} ${p.name} 해금<small>${p.d(1)} · 정수 상점 진열 풀에 추가 (영구)</small></div><button class="buy" data-unl="${p.id}" ${META.ruby < p.ruby ? 'disabled' : ''}>💎 ${p.ruby}</button></div>`);
      return rows.length ? '<div class="shop-row"><div class="info">🗝️ 해금<small>기원석(💎)으로 아이템을 영구 해금합니다</small></div></div>' + rows.join('') : '';
    }
    // 정수 상점: 웨이브마다 4종 진열(패시브 2종 이상 보장), 리롤 가능 (한 판 안에서만 쓰는 재화)
    function rollStock() {
      const shuf = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
      const ps = shuf(PASSIVES.filter(p => passiveOpen(p) && iLv(p.id) < 3).map(p => p.id));
      const first = ps.slice(0, 2), rest = shuf([...ITEMS.map(i => i.id), ...ps.slice(2)]);
      G.stock = [...first, ...rest].slice(0, 4);
    }
    function newStock() { rollStock(); G.rerolls = 0; }

    function loadMeta() {
      try {
        const d = JSON.parse(localStorage.getItem(SAVE_KEY) || localStorage.getItem(LEGACY_SAVE_KEY) || 'null');
        if (d) {
          META.ruby = d.ruby | 0; META.best = d.best | 0; META.clear = d.clear || {}; META.unl = d.unl || {};
          if (d.dex) META.dex = { u: d.dex.u || [], t: d.dex.t || [], s: d.dex.s || [], a: d.dex.a || [], l: d.dex.l || [] };
          Object.assign(META.up, d.up || {});
          saveMeta();
        }
      } catch (e) {}
    }
    function saveMeta() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(META)); } catch (e) {} }

    let shopTab = 'items';
    function renderShop() {
      $('rubyShop').textContent = META.ruby; $('essShop').textContent = G.essence | 0;
      $('shopList').innerHTML = shopTab === 'dex' ? dexHtml() : shopTab === 'items'
        ? `<div class="shop-row"><div class="info">🎒 장착 ${equippedCount()}/${itemCap()}<small>${PASSIVES.filter(p => iLv(p.id) > 0).map(p => p.icon + p.name + ' Lv' + iLv(p.id)).join(' · ') || '없음'}</small></div></div>`
          + ((G.stock || []).map(itemById).filter(Boolean).map(it => {
            if (it.passive) {
              const cur = iLv(it.id), cost = passiveCost(it), noSlot = cur === 0 && equippedCount() >= itemCap();
              return `<div class="shop-row"><div class="info">${it.icon} ${it.name} ${cur ? 'Lv' + cur + ' → Lv' + (cur + 1) : '(NEW)'}<small>${it.d(cur + 1)}${noSlot ? ' · 장착 칸 부족' : ''}</small></div><button class="buy" data-item="${it.id}" ${G.essence < cost || noSlot ? 'disabled' : ''}>🔷 ${cost}</button></div>`;
            }
            return `<div class="shop-row"><div class="info">${it.icon} ${it.name}<small>${it.desc}</small></div><button class="buy" data-item="${it.id}" ${G.essence < it.cost ? 'disabled' : ''}>🔷 ${it.cost}</button></div>`;
          }).join('') || '<div class="shop-row"><div class="info">품절<small>리롤하거나 다음 웨이브 클리어 후 새 상품이 들어와요</small></div></div>')
          + `<div class="shop-row"><div class="info">🔄 리롤<small>진열 상품을 새로 고칩니다 (정수는 이번 판에만 쓰여요)</small></div><button class="buy" data-reroll="1" ${G.essence < 2 + G.rerolls ? 'disabled' : ''}>🔷 ${2 + G.rerolls}</button></div>`
        : UPGRADES.map(u => {
            const lv = META.up[u.k], maxed = lv >= u.max, cost = u.cost * (lv + 1);
            return `<div class="shop-row"><div class="info">${u.name}<small>${u.desc} · Lv ${lv}/${u.max}</small></div><button class="buy" data-up="${u.k}" ${maxed || META.ruby < cost ? 'disabled' : ''}>${maxed ? 'MAX' : '💎 ' + cost}</button></div>`;
          }).join('') + unlockRows();
    }

    $('shopList').addEventListener('click', e => {
      const b = e.target.closest('.buy');
      if (!b || b.disabled) return;
      const msg = $('shopMsg');
      if (b.dataset.reroll) {
        if (G.phase === 'over') { msg.textContent = '게임 오버 상태예요. 다시 시작한 뒤 사용하세요'; return; }
        const rc = 2 + G.rerolls; if (G.essence < rc) { msg.textContent = '정수가 부족해요'; return; }
        G.essence -= rc; G.rerolls += 1; rollStock(); msg.textContent = '상품을 새로 고쳤어요';
      } else if (b.dataset.item) {
        const it = itemById(b.dataset.item);
        if (G.phase === 'over') { msg.textContent = '게임 오버 상태예요. 다시 시작한 뒤 사용하세요'; return; }
        if (it.passive) {
          const cur = iLv(it.id), cost = passiveCost(it);
          if (G.essence < cost) { msg.textContent = '정수가 부족해요'; return; }
          if (cur === 0 && equippedCount() >= itemCap()) { msg.textContent = '장착 칸이 부족해요'; return; }
          G.essence -= cost; G.items[it.id] = cur + 1; G.stock = G.stock.filter(id => id !== it.id);
          reapplyAll(); msg.textContent = `${it.icon} ${it.name} Lv${cur + 1}!`;
          saveMeta(); updateHud(); renderShop(); renderField(); renderBoard(); return;
        }
        if (G.essence < it.cost) { msg.textContent = '정수가 부족해요'; return; }
        if (!it.use()) { msg.textContent = it.fail; return; }
        G.essence -= it.cost; G.stock = G.stock.filter(id => id !== it.id);
        msg.textContent = `${it.name} 사용!`;
      } else if (b.dataset.unl) {
        const p = PASSIVES.find(x => x.id === b.dataset.unl);
        if (!p || META.ruby < p.ruby) return;
        META.ruby -= p.ruby; META.unl[p.id] = 1; msg.textContent = `${p.icon} ${p.name} 해금!`;
      } else {
        const u = UPGRADES.find(x => x.k === b.dataset.up);
        META.ruby -= u.cost * (META.up[u.k] + 1);
        META.up[u.k] += 1;
        G.units.forEach(x => { const r = x.hp / x.maxHp; applyStats(x); x.hp = x.maxHp * r; });
        msg.textContent = `${u.name} Lv ${META.up[u.k]}!`;
      }
      saveMeta(); updateHud(); renderShop(); renderField();
    });

    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      shopTab = t.dataset.tab;
      document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
      $('shopMsg').textContent = '';
      renderShop();
    }));
    function closeShop() {
      $('shopPanel').classList.remove('open');
      overlay.classList.remove('show');
      mainArea.classList.remove('dimmed');
    }
    $('shopBtn').addEventListener('click', () => {
      $('shopMsg').textContent = '';
      renderShop();
      $('shopPanel').classList.add('open');
      overlay.classList.add('show');
      mainArea.classList.add('dimmed');
    });
    $('shopClose').addEventListener('click', closeShop);
    overlay.addEventListener('click', closeShop);
    loadMeta();
    renderLobby();

    startBtn.addEventListener('click', () => G.phase === 'over' ? resetGame() : startWave());
    resetGame();
  </script>
</body>
</html>
